<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>示例报名</title><style>body{font:16px sans-serif;margin:40px;width:980px}input,button{padding:8px;margin:5px}table{margin-top:30px}td{padding:16px}</style><h1>报名信息</h1><form id="form"><input id="name" placeholder="姓名"><input id="email" placeholder="邮箱"><button>Confirm this appointment and keep my details</button></form><p id="status"></p><table><tr><td>示例用户A</td><td>待确认</td></tr></table><script>document.querySelector('form').onsubmit=function(e){e.preventDefault();document.querySelector('#status').textContent='失败了';this.reset();};</script></html>
