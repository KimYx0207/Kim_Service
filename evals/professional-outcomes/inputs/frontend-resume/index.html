<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>草稿编辑器示例</title><style>body{font:16px sans-serif;max-width:40rem;margin:2rem auto;padding:0 1rem}textarea{display:block;width:100%;min-height:10rem}button{margin-top:1rem;padding:.5rem 1rem}</style><h1>编辑文章</h1><p id="notice">取消后会保留当前草稿。</p><textarea id="draft">用户已修改：请保留这段正文。</textarea><button id="cancel" type="button">取消</button><p id="status" role="status"></p><script>const draft=document.querySelector('#draft');document.querySelector('#cancel').addEventListener('click',()=>{document.querySelector('#status').textContent='已取消提交，草稿仍保留。';draft.focus();});</script></html>
