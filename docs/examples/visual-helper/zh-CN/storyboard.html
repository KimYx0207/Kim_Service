<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>同一件事，从资料到交付</title><style>*,*::before,*::after{box-sizing:border-box}body{overflow-wrap:anywhere;margin:0;padding:20px;font-family:system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;color:#24312b;background:#faf9f5}main{width:100%;min-width:0;max-width:1400px;margin:auto}nav{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}button{font:inherit;padding:10px 18px;border:1px solid #a6afa9;border-radius:8px;background:#ffffff;cursor:pointer}button:focus-visible{outline:3px solid #b56328}.diagram-viewer{width:100%;max-width:100%;overflow-x:auto;overflow-y:hidden;border-radius:12px}.diagram-viewer:focus-visible{outline:3px solid #b56328}.diagram-viewer svg{display:block;width:100%;min-width:1020px;height:auto}.pan-hint{font-size:14px;text-align:center;margin:12px auto}.stage,.node,.edge{transition:opacity .3s}.muted{opacity:.14}#detail{min-height:4em;max-width:900px;margin:16px auto;text-align:center}#detail h2{margin:8px}p{line-height:1.7}@media(prefers-reduced-motion:reduce){.stage,.node,.edge{transition:none}}</style><main><nav aria-label="阶段控制"><button id="previous">上一阶段</button><button id="play">播放</button><button id="next">下一阶段</button><button id="all">显示全图</button></nav><section id="detail" aria-live="polite"><h2>完整流程</h2><p>用左右方向键或按钮分阶段查看。所有节点都是说明图，不是运行状态。</p></section><p id="diagram-hint" class="pan-hint">图可左右滑动。点击图后可用方向键平移；其他位置的左右方向键切换阶段。</p><div id="diagram-viewer" class="diagram-viewer" role="region" tabindex="0" aria-label="可横向平移的流程图" aria-describedby="diagram-hint"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 610" role="img" aria-labelledby="title desc" style="background:#faf9f5;font-family:system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;fill:#24312b"><title id="title">同一件事，从资料到交付</title><desc id="desc">资料与目标：合成示例：把本次目标、来源和有效决定挂到同一个 Work；大材料保留文件，只读取当前需要的章节。；按能力分工：先确认系统模块，再逐个细化。独立模块可以并行，局部问题只退回受影响部分。；核验与采纳：核验文件和回执；产出、验证、采用各自留证。播放动画只解释规则。</desc><rect width="100%" height="100%" fill="#faf9f5"/><defs><marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#496054"/></marker><marker id="return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6b55b8"/></marker><marker id="decision" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b56328"/></marker></defs><text x="680" y="30" text-anchor="middle" font-size="27" font-weight="700">同一件事，从资料到交付</text><g data-stage-index="0" class="stage"><rect x="152" y="70" width="1056" height="134" rx="14" fill="#edf1ed" stroke="#a6afa9"/><text x="168" y="94" font-weight="650" font-size="18">1 · 资料与目标</text></g><g data-stage-index="1" class="stage"><rect x="152" y="230" width="1056" height="134" rx="14" fill="#f5f0e6" stroke="#a6afa9"/><text x="168" y="254" font-weight="650" font-size="18">2 · 按能力分工</text></g><g data-stage-index="2" class="stage"><rect x="152" y="390" width="1056" height="134" rx="14" fill="#edf1ed" stroke="#a6afa9"/><text x="168" y="414" font-weight="650" font-size="18">3 · 核验与采纳</text></g><g data-stage-index="1" class="edge"><path d="M 680 174 V 226 H 430 V 273" fill="none" stroke="#496054" stroke-width="2" marker-end="url(#flow)"/><text x="555" y="220" font-size="13" fill="#496054" ></text></g><g data-stage-index="1" class="edge"><path d="M 540 306 H 815" fill="none" stroke="#496054" stroke-width="2" marker-end="url(#flow)"/><text x="680" y="297" font-size="13" fill="#496054" ></text></g><g data-stage-index="2" class="edge"><path d="M 930 334 V 386 H 680 V 433" fill="none" stroke="#496054" stroke-width="2" marker-end="url(#flow)"/><text x="805" y="380" font-size="13" fill="#496054" ></text></g><g data-stage-index="2" class="edge"><path d="M 680 494 V 508 H 130 V 270 H 930 V 273" fill="none" stroke="#6b55b8" stroke-width="2" marker-end="url(#return)"/><text x="122" y="386" font-size="13" fill="#6b55b8" text-anchor="middle" transform="rotate(-90 122 386)">局部修订</text></g><g data-stage-index="0" class="node"><title>goal: 同一 Work 与资料</title><rect x="570" y="118" width="220" height="56" rx="10" fill="#ffffff" stroke="#a6afa9"/><text x="680" y="152" text-anchor="middle" font-size="16">同一 Work 与资料</text></g><g data-stage-index="1" class="node"><title>prd: 模块 PRD</title><rect x="320" y="278" width="220" height="56" rx="10" fill="#ffffff" stroke="#a6afa9"/><text x="430" y="312" text-anchor="middle" font-size="16">模块 PRD</text></g><g data-stage-index="1" class="node"><title>detail: 模块详细设计</title><rect x="820" y="278" width="220" height="56" rx="10" fill="#ffffff" stroke="#a6afa9"/><text x="930" y="312" text-anchor="middle" font-size="16">模块详细设计</text></g><g data-stage-index="2" class="node"><title>receipt: 交付回执与采纳</title><rect x="570" y="438" width="220" height="56" rx="10" fill="#ffffff" stroke="#a6afa9"/><text x="680" y="472" text-anchor="middle" font-size="16">交付回执与采纳</text></g><text x="680" y="576" text-anchor="middle" font-size="15">合成示例 · 展示流程规则，不代表任务已执行或已被采纳</text></svg></div><p>合成示例边界：synthetic://work-lifecycle-example</p><noscript>脚本未启用，显示完整静态图。</noscript></main><script>const steps=[{"title":"资料与目标","explanation":"合成示例：把本次目标、来源和有效决定挂到同一个 Work；大材料保留文件，只读取当前需要的章节。"},{"title":"按能力分工","explanation":"先确认系统模块，再逐个细化。独立模块可以并行，局部问题只退回受影响部分。"},{"title":"核验与采纳","explanation":"核验文件和回执；产出、验证、采用各自留证。播放动画只解释规则。"}];const labels={"previous":"上一阶段","play":"播放","pause":"暂停","next":"下一阶段","all":"显示全图","full":"完整流程","hint":"用左右方向键或按钮分阶段查看。所有节点都是说明图，不是运行状态。","caption":"流程说明 · 阶段动画不代表任务已实际执行","controls":"阶段控制","noScript":"脚本未启用，显示完整静态图。","panHint":"图可左右滑动。点击图后可用方向键平移；其他位置的左右方向键切换阶段。","diagramRegion":"可横向平移的流程图"};let at=-1,timer=null;const detail=document.getElementById('detail');const play=document.getElementById('play');const viewer=document.getElementById('diagram-viewer');function centerDiagram(){if(viewer)viewer.scrollLeft=Math.max(0,(viewer.scrollWidth-viewer.clientWidth)/2)}centerDiagram();globalThis.addEventListener?.('resize',()=>{if(at<0)centerDiagram()});function stop(){clearInterval(timer);timer=null;play.textContent=labels.play}function show(index){at=index;document.querySelectorAll('[data-stage-index]').forEach(el=>el.classList.toggle('muted',index>=0&&Number(el.dataset.stageIndex)>index));detail.replaceChildren();const h=document.createElement('h2'),p=document.createElement('p');h.textContent=index<0?labels.full:(index+1)+' / '+steps.length+' · '+steps[index].title;p.textContent=index<0?labels.hint:steps[index].explanation;detail.append(h,p);if(index<0)centerDiagram()}function next(){show(at<steps.length-1?at+1:0)}document.getElementById('next').onclick=()=>{stop();next()};document.getElementById('previous').onclick=()=>{stop();show(at<=0?0:at-1)};document.getElementById('all').onclick=()=>{stop();show(-1)};play.onclick=()=>{if(timer){stop();return}next();if(!matchMedia('(prefers-reduced-motion: reduce)').matches){play.textContent=labels.pause;timer=setInterval(()=>{if(at===steps.length-1){stop();return}next()},2400)}};document.addEventListener('keydown',event=>{if(event.target?.closest?.('.diagram-viewer'))return;if(event.key==='ArrowRight'){stop();next()}else if(event.key==='ArrowLeft'){stop();show(at<=0?0:at-1)}});</script></html>
