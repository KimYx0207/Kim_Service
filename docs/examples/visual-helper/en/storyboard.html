<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One Work, from sources to delivery</title><style>*,*::before,*::after{box-sizing:border-box}body{overflow-wrap:anywhere;margin:0;padding:20px;font-family:system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;color:#24312b;background:#faf9f5}main{width:100%;min-width:0;max-width:1400px;margin:auto}nav{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}button{font:inherit;padding:10px 18px;border:1px solid #a6afa9;border-radius:8px;background:#ffffff;cursor:pointer}button:focus-visible{outline:3px solid #b56328}.diagram-viewer{width:100%;max-width:100%;overflow-x:auto;overflow-y:hidden;border-radius:12px}.diagram-viewer:focus-visible{outline:3px solid #b56328}.diagram-viewer svg{display:block;width:100%;min-width:1020px;height:auto}.pan-hint{font-size:14px;text-align:center;margin:12px auto}.stage,.node,.edge{transition:opacity .3s}.muted{opacity:.14}#detail{min-height:4em;max-width:900px;margin:16px auto;text-align:center}#detail h2{margin:8px}p{line-height:1.7}@media(prefers-reduced-motion:reduce){.stage,.node,.edge{transition:none}}</style><main><nav aria-label="Phase controls"><button id="previous">Previous phase</button><button id="play">Play</button><button id="next">Next phase</button><button id="all">Show all</button></nav><section id="detail" aria-live="polite"><h2>Complete flow</h2><p>Use arrow keys or buttons to explore phases. This diagram explains a process; it is not execution status.</p></section><p id="diagram-hint" class="pan-hint">Pan horizontally to read the diagram. When focused on the diagram, arrow keys pan; elsewhere they change phases.</p><div id="diagram-viewer" class="diagram-viewer" role="region" tabindex="0" aria-label="Horizontally pannable process diagram" aria-describedby="diagram-hint"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 610" role="img" aria-labelledby="title desc" style="background:#faf9f5;font-family:system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;fill:#24312b"><title id="title">One Work, from sources to delivery</title><desc id="desc">Sources and goals：Synthetic example: keep the goal, sources and valid decisions on one Work. Preserve large materials in files and read only the sections needed now.；Capability roles：Confirm system modules first, then refine each module. Independent modules can proceed in parallel; local problems return only the affected part for revision.；Verify and adopt：Check delivered files and receipts. Record output, verification and adoption separately; the animation explains the rules and does not prove execution.</desc><rect width="100%" height="100%" fill="#faf9f5"/><defs><marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#496054"/></marker><marker id="return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6b55b8"/></marker><marker id="decision" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b56328"/></marker></defs><text x="680" y="30" text-anchor="middle" font-size="27" font-weight="700">One Work, from sources to delivery</text><g data-stage-index="0" class="stage"><rect x="152" y="70" width="1056" height="134" rx="14" fill="#edf1ed" stroke="#a6afa9"/><text x="168" y="94" font-weight="650" font-size="18">1 · Sources and goals</text></g><g data-stage-index="1" class="stage"><rect x="152" y="230" width="1056" height="134" rx="14" fill="#f5f0e6" stroke="#a6afa9"/><text x="168" y="254" font-weight="650" font-size="18">2 · Capability roles</text></g><g data-stage-index="2" class="stage"><rect x="152" y="390" width="1056" height="134" rx="14" fill="#edf1ed" stroke="#a6afa9"/><text x="168" y="414" font-weight ext></g><text x="680" y="576" text-anchor="middle" font-size="15">Synthetic example · A workflow explanation, not execution evidenc</text><text x="680" y="594" text-anchor="middle" font-size="15">e</text></svg></div><p>Synthetic example boundary：synthetic://work-lifecycle-example</p><noscript>JavaScript is unavailable. The complete static diagram is shown.</noscript></main><script>const steps=[{"title":"Sources and goals","explanation":"Synthetic example: keep the goal, sources and valid decisions on one Work. Preserve large materials in files and read only the sections needed now."},{"title":"Capability roles","explanation":"Confirm system modules first, then refine each module. Independent modules can proceed in parallel; local problems return only the affected part for revision."},{"title":"Verify and adopt","explanation":"Check delivered files and receipts. Record output, verification and adoption separately; the animation explains the rules and does not prove execution."}];const labels={"previous":"Previous phase","play":"Play","pause":"Pause","next":"Next phase","all":"Show all","full":"Complete flow","hint":"Use arrow keys or buttons to explore phases. This diagram explains a process; it is not execution status.","caption":"Process explanation · animation does not prove execution","controls":"Phase controls","noScript":"JavaScript is unavailable. The complete static diagram is shown.","panHint":"Pan horizontally to read the diagram. When focused on the diagram, arrow keys pan; elsewhere they change phases.","diagramRegion":"Horizontally pannable process diagram"};let at=-1,timer=null;const detail=document.getElementById('detail');const play=document.getElementById('play');const viewer=document.getElementById('diagram-viewer');function centerDiagram(){if(viewer)viewer.scrollLeft=Math.max(0,(viewer.scrollWidth-viewer.clientWidth)/2)}centerDiagram();globalThis.addEventListener?.('resize',()=>{if(at<0)centerDiagram()});function stop(){clearInterval(timer);timer=null;play.textContent=labels.play}function show(index){at=index;document.querySelectorAll('[data-stage-index]').forEach(el=>el.classList.toggle('muted',index>=0&&Number(el.dataset.stageIndex)>index));detail.replaceChildren();const h=document.createElement('h2'),p=document.createElement('p');h.textContent=index<0?labels.full:(index+1)+' / '+steps.length+' · '+steps[index].title;p.textContent=index<0?labels.hint:steps[index].explanation;detail.append(h,p);if(index<0)centerDiagram()}function next(){show(at<steps.length-1?at+1:0)}document.getElementById('next').onclick=()=>{stop();next()};document.getElementById('previous').onclick=()=>{stop();show(at<=0?0:at-1)};document.getElementById('all').onclick=()=>{stop();show(-1)};play.onclick=()=>{if(timer){stop();return}next();if(!matchMedia('(prefers-reduced-motion: reduce)').matches){play.textContent=labels.pause;timer=setInterval(()=>{if(at===steps.length-1){stop();return}next()},2400)}};document.addEventListener('keydown',event=>{if(event.target?.closest?.('.diagram-viewer'))return;if(event.key==='ArrowRight'){stop();next()}else if(event.key==='ArrowLeft'){stop();show(at<=0?0:at-1)}});</script></html>
