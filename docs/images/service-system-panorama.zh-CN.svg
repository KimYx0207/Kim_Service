s="moving-dot phase p4" r="6" fill="#ce7b24"><animateMotion path="M698 775 V811 H480" dur="2.7s" repeatCount="indefinite"/></circle><path d="M473 837 L480 846 L487 837" fill="none" stroke="#2968e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path class="route" d="M480 995 V1043"/><path class="trail phase p5" d="M480 995 V1043" stroke="#0d9488"/><circle class="moving-dot phase p5" r="6" fill="#0d9488"><animateMotion path="M480 995 V1043" dur="2.7s" repeatCount="indefinite"/></circle><path d="M473 1041 L480 1050 L487 1041" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path class="route" d="M896 1125 H931 V923 H903"/><path class="trail phase p5" d="M896 1125 H931 V923 H903" stroke="#ce7b24"/><circle class="moving-dot phase p5" r="6" fill="#ce7b24"><animateMotion path="M896 1125 H931 V923 H903" dur="2.7s" repeatCount="indefinite"/></circle><path d="M911 916 L903 923 L911 930" fill="none" stroke="#ce7b24" stroke-width="3"/><text x="925" y="1029" transform="rotate(-90 925 1029)" class="tiny center" style="fill:#ce7b24">修正</text><g class="node" data-label="在当前 Agent 里说目标"><rect x="64" y="208" width="832" height="105" rx="22" fill="#e8eef7" opacity=".7"/><rect x="64" y="205" width="832" height="105" rx="22" fill="#edf3ff" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p0" x="64" y="205" width="832" height="105" rx="22" stroke="#2968e8"/><text x="480" y="248" class="strategy-label center">在当前 Agent 里说目标</text><text x="480" y="291" class="strategy-body center">带上材料、限制与已经确定的选择</text></g><g class="node" data-label="本次实际研究"><rect x="64" y="368" width="396" height="190" rx="22" fill="#e8eef7" opacity=".7"/><rect x="64" y="365" width="396" height="190" rx="22" fill="#fff" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p1" x="64" y="365" width="396" height="190" rx="22" stroke="#2968e8"/><text x="88" y="408" class="strategy-label">本次实际研究</text><text x="88" y="451" class="strategy-body">查官方资料与外部项目</text><text x="88" y="485" class="strategy-body">读取版本、源码和测试</text><text x="88" y="519" class="strategy-body">留下来源与采用依据</text></g><g class="node" data-label="比较可行路线"><rect x="500" y="368" width="396" height="190" rx="22" fill="#e8eef7" opacity=".7"/><rect x="500" y="365" width="396" height="190" rx="22" fill="#fff" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p2" x="500" y="365" width="396" height="190" rx="22" stroke="#7c56d8"/><text x="524" y="408" class="strategy-label">比较可行路线</text><text x="524" y="451" class="strategy-body">面向谁，解决什么问题</text><text x="524" y="485" class="strategy-body">成本、条件、代价与未知</text><text x="524" y="519" class="strategy-body">给出建议和不选的理由</text></g><g class="node" data-label="已有有效选择"><rect x="64" y="633" width="396" height="145" rx="22" fill="#e8eef7" opacity=".7"/><rect x="64" y="630" width="396" height="145" rx="22" fill="#edf8f6" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p3" x="64" y="630" width="396" height="145" rx="22" stroke="#0d9488"/><text x="88" y="673" class="strategy-label">已有有效选择</text><text x="88" y="716" class="strategy-body">沿用已确认方向</text><text x="88" y="750" class="strategy-body">继续后续专业工作</text></g><g class="node" data-label="仍有关键选择"><rect x="500" y="633" width="396" height="145" rx="22" fill="#e8eef7" opacity=".7"/><rect x="500" y="630" width="396" height="145" rx="22" fill="#fff7ed" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p3" x="500" y="630" width="396" height="145" rx="22" stroke="#ce7b24"/><text x="524" y="673" class="strategy-label">仍有关键选择</text><text x="524" y="716" class="strategy-body">把方案与取舍交给你</text><text x="524" y="750" class="strategy-body">选定方向后接着做</text></g><g class="node" data-label="专业方法进入任务"><rect x="64" y="858" width="832" height="140" rx="22" fill="#e8eef7" opacity=".7"/><rect x="64" y="855" width="832" height="140" rx="22" fill="#fff" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p4" x="64" y="855" width="832" height="140" rx="22" stroke="#2968e8"/><text x="480" y="898" class="strategy-label center">专业方法进入任务</text><text x="480" y="941" class="strategy-body center">Agent / Skill ＋ 项目规则 ＋ 实际工具</text><text x="480" y="975" class="strategy-body center">按依赖安排工作，交付文件、页面或代码</text></g><g class="node" data-label="打开成果，逐项验收"><rect x="64" y="1063" width="832" height="140" rx="22" fill="#e8eef7" opacity=".7"/><rect x="64" y="1060" width="832" height="140" rx="22" fill="#edf8f6" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p5" x="64" y="1060" width="832" height="140" rx="22" stroke="#0d9488"/><text x="480" y="1103" class="strategy-label center">打开成果，逐项验收</text><text x="480" y="1146" class="strategy-body center">通过：保留成果、采用版本与下一步</text><text x="480" y="1180" class="strategy-body center">发现问题：返回受影响步骤修正</text></g><rect x="48" y="1230" width="864" height="69" rx="18" fill="#eaf0fb"/><text x="480" y="1274" class="note center steady">研究 → 比较 → 决定 → 执行 → 验收</text><text x="480" y="1274" class="note center phase-copy phase p0">从当前对话和已有材料开始</text><text x="480" y="1274" class="note center phase-copy phase p1">实际读取会影响选择的当前来源</text><text x="480" y="1274" class="note center phase-copy phase p2">让证据改变候选方案与推荐</text><text x="480" y="1274" class="note center phase-copy phase p3">已有决定沿用，只补关键未决选择</text><text x="480" y="1274" class="note center phase-copy phase p4">由当前客户端执行相关专业方法</text><text x="480" y="1274" class="note center phase-copy phase p5">检查实际结果，修正后再验收</text><text x="480" y="1340" class="tiny center">能力目录按需浏览；Meta_Kim 编排复杂任务。</text><text x="480" y="1371" class="tiny center">一项选择待定时，无关的独立工作继续。</text>
