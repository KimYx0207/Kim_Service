<text x="111" y="840" font-size="23" font-weight="450" fill="#52665e" text-anchor="start"><tspan x="111" dy="0">任务较大时，帮助分工、</tspan><tspan x="111" dy="33.35">检查并接着上次继续。</tspan></text>
