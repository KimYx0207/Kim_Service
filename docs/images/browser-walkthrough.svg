<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="860" viewBox="0 0 1000 860" lang="en" xml:lang="en" role="img" aria-labelledby="title desc">
<title id="title">From a task to a request you can use.</title><desc id="desc">Example: build a 12-month cash forecast for a small shop.</desc>
<style>text{font-family:Inter, Arial,sans-serif} path{stroke-linecap:round;stroke-linejoin:round}</style>
<rect x="0" y="0" width="1000" height="860" rx="26" fill="#f3f6fb" stroke="none"/>
<text x="42" y="48" font-size="22" font-weight="750" fill="#13775b">KIM SERVICE</text>
<text x="958" text-anchor="end" y="48" font-size="17" font-weight="500" fill="#435169">ILLUSTRATED WALKTHROUGH</text>
<text x="42" y="108" font-size="38" font-weight="750" fill="#11243b">From a task to a request you can use.</text>
<text x="42" y="151" font-size="23" font-weight="400" fill="#435169">Example: build a 12-month cash forecast for a small shop.</text>
<rect x="42" y="190" width="436" height="420" rx="22" fill="#fff" stroke="#dce4ef"/>
<text x="66" y="235" font-size="28" font-weight="700" fill="#11243b">01  Find the capability</text>
<rect x="66" y="267" width="388" height="61" rx="13" fill="#f3f6fb" stroke="none"/>
<text x="86" y="306" font-size="23" font-weight="400" fill="#435169">Search for “financial-modeler”</text>
<rect x="66" y="354" width="388" height="161" rx="16" fill="#eaf5ed" stroke="#c7dfd0"/>
<text x="88" y="398" font-size="27" font-weight="700" fill="#17624b">Financial modeler</text>
<text x="88" y="438" font-size="22" font-weight="400" fill="#435169">12-month forecast · scenarios</text>
<text x="88" y="480" font-size="21" font-weight="400" fill="#435169">Inputs, method and deliverables</text>
<text x="66" y="571" font-size="18" font-weight="600" fill="#13775b">Keep your draft · Save, export and resume</text>
<rect x="520" y="190" width="436" height="420" rx="22" fill="#fff" stroke="#dce4ef"/>
<text x="544" y="235" font-size="28" font-weight="700" fill="#11243b">02  Make it your task</text>
<text x="544" y="276" font-size="21" font-weight="600" fill="#435169">Your goal</text>
<rect x="544" y="293" width="388" height="56" rx="10" fill="#f8fafc" stroke="#d6dfe8"/>
<text x="560" y="330" font-size="22" font-weight="450" fill="#223850">Forecast cash for the next year</text>
<text x="544" y="384" font-size="21" font-weight="600" fill="#435169">Your material</text>
<rect x="544" y="401" width="388" height="56" rx="10" fill="#f8fafc" stroke="#d6dfe8"/>
<text x="560" y="438" font-size="22" font-weight="450" fill="#223850">Sales, costs and opening cash</text>
<text x="544" y="492" font-size="21" font-weight="600" fill="#435169">Your AI tool</text>
<rect x="544" y="509" width="388" height="56" rx="10" fill="#f8fafc" stroke="#d6dfe8"/>
<text x="560" y="546" font-size="22" font-weight="450" fill="#223850">Meta_Kim / your preferred host</text>
<rect x="42" y="644" width="914" height="119" rx="20" fill="#123f35" stroke="none"/>
<text x="66" y="682" font-size="27" font-weight="700" fill="#eafff4">03  Copy and continue</text>
<text x="66" y="716" font-size="27" font-weight="650" fill="#fff">Copy request → paste into your AI tool</text>
<text x="66" y="746" font-size="19" font-weight="400" fill="#c5e6d9">The linked method and project material travel with the task.</text>
<text x="42" y="815" font-size="24" font-weight="650" fill="#17624b">Try the example  /  Edit inputs · download JSON / CSV</text>
</svg>
