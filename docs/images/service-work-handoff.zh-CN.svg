="720" dy="0">上下文挂在事项上，产物、验证、采用和效果各自留下证据</tspan></text><text x="355" y="128" fill="#5f6a62" font-size="20" font-weight="450" text-anchor="start"><tspan x="355" dy="0">主流程</tspan></text><text x="570" y="128" fill="#5f6a62" font-size="20" font-weight="450" text-anchor="start"><tspan x="570" dy="0">退回 / 补齐</tspan></text><text x="800" y="128" fill="#5f6a62" font-size="20" font-weight="450" text-anchor="start"><tspan x="800" dy="0">人的决定</tspan></text><text x="1040" y="128" fill="#5f6a62" font-size="20" font-weight="450" text-anchor="start"><tspan x="1040" dy="0">写入记录</tspan></text><text x="62" y="190" fill="#fff" font-size="26" font-weight="700" text-anchor="start"><tspan x="62" dy="0">公司事项 Work · 主记录由宿主保存</tspan></text><text x="720" y="218" fill="#dae4db" font-size="21" font-weight="450" text-anchor="middle"><tspan x="720" dy="0">换人、换会话，仍接着同一件事；可见范围由宿主控制</tspan></text><text x="219.0" y="268.0" fill="#202b24" font-size="23" font-weight="700" text-anchor="middle"><tspan x="219.0" dy="0">目标与当前上下文</tspan></text><text x="553.0" y="268.0" fill="#202b24" font-size="23" font-weight="700" text-anchor="middle"><tspan x="553.0" dy="0">责任人与可见范围</tspan></text><text x="887.0" y="268.0" fill="#202b24" font-size="23" font-weight="700" text-anchor="middle"><tspan x="887.0" dy="0">来源与有效决定</tspan></text><text x="1221.0" y="268.0" fill="#202b24" font-size="23" font-weight="700" text-anchor="middle"><tspan x="1221.0" dy="0">采用版本与下一步</tspan></text><text x="62" y="392" fill="#202b24" font-size="26" font-weight="700" text-anchor="start"><tspan x="62" dy="0"></tspan></text><text x="860" y="392" fill="#202b24" font-size="26" font-weight="700" text-anchor="middle"><tspan x="860" dy="0">本轮专业工作 · 当前 AI 客户端实际执行</tspan></text><text x="204.0" y="451.0" fill="#202b24" font-size="23" font-weight="700" text-anchor="middle"><tspan x="204.0" dy="0">绑定事项与本轮材料</tspan></text><text x="204.0" y="481.0" fill="#5f6a62" font-size="20" font-weight="450" text-anchor="middle"><tspan x="204.0" dy="0">读取上下文和有效决定</tspan></text><text x="544.0" y="451.0" fill="#202b24" font-size="23" font-weight="700" text-anchor="middle"><tspan x="544.0" dy="0">选择专业方法</tspan></text><text x="544.0" y="481.0" fill="#5f6a62" font-size="20" font-weight="450" text-anchor="middle"><tspan x="544.0" dy="0">Agent · Skill · Hook · Tool</tspan></text><text x="884.0" y="451.0" fill="#202b24" font-size="23" font-weight="700" text-anchor="middle"><tspan x="884.0" dy="0">执行本轮专业任务</tspan></text><text x="884.0" y="481.0" fill="#5f6a62" font-size="20" font-weight="450" text-anchor="middle"><tspan x="884.0" dy="0">在当前客户端使用工具</tspan></text><text x="1230.0" y="451.0" fill="#202b24" font-size="23" font-weight="700" text-anchor="middle"><tspan x="1230.0" dy="0">形成实际产物</tspan></text><text x="1230.0" y="481.0" fill="#5f6a62" font-size="20" font-weight="450" text-anchor="middle"><tspan x="1230.0" dy="0">本轮版本与文件引用</tspan></text><rect x="243.0" y="356" width="114.0" height="26" rx="3" fill="#f8f7f2"/><text x="300" y="376" fill="#46544a" font-size="20" font-weight="450" text-anchor="middle"><tspan x="300" dy="0">读取并绑定</tspan></text><text x="62" y="600" fill="#202b24" font-size="26" font-weight="700" text-anchor="start"><tspan x="62" dy="0">核验、采用与交接 · 沿用有效决定，必要时才请人选择</tspan></text><text x="1230.0" y="655.0" fill="#202b24" font-size="23" font-weight="700" text-anchor="middle"><tspan x="1230.0" dy="0">独立核验实际成果</tspan></text><text x="1230.0" y="685.0" fill="#5f6a62" font-size="20" font-weight="450" text-anchor="middle"><tspan x="1230.0" dy="0">按要求核对文件与行为</tspan></text><text x="955.0" y="670.0" fill="#202b24" font-size="22" font-weight="700" text-anchor="middle"><tspan x="955.0" dy="0">通过？</tspan></text><text x="710.0" y="670.0" fill="#202b24" font-size="22" font-weight="700" text-anchor="middle"><tspan x="710.0" dy="0">需你决定？</tspan></text><text x="450.0" y="655.0" fill="#202b24" font-size="23" font-weight="700" text-anchor="middle"><tspan x="450.0" dy="0">记录采用状态</tspan></text><text x="450.0" y="685.0" fill="#5f6a62" font-size="20"