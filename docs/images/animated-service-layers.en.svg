<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1485" viewBox="0 0 960 1485" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Separate methods, application, data and UI</title><desc id="desc">The task browser prepares a request for the client you choose. Main steps and connections stay visible. Animation explains order and state changes; reduced motion displays the complete result.</desc>
<style>
    text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17263f}
    .title{font-size:40px;font-weight:700;letter-spacing:-.5px}.sub{font-size:26px;fill:#566782}
    .label{font-size:36px;font-weight:700}.body{font-size:32px}.note{font-size:28px;fill:#566782}
    .tiny{font-size:22px;fill:#566782}.center{text-anchor:middle}
    .route{fill:none;stroke:#dbe4f0;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .focus{fill:none;stroke-width:4;opacity:0}.trail{fill:none;stroke-width:5;stroke-linecap:round;stroke-dasharray:16 11;opacity:0}
    .phase-copy,.moving-dot{opacity:0}.steady{opacity:0}.phase{animation-duration:24s;animation-iteration-count:infinite;animation-timing-function:linear;animation-fill-mode:both}
    .after{opacity:0;animation-duration:24s;animation-iteration-count:infinite}.before{animation-duration:24s;animation-iteration-count:infinite}.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation-duration:24s;animation-iteration-count:infinite}
    @keyframes done0{0%,4%{opacity:0}23%,97%{opacity:1}100%{opacity:0}}@keyframes pending0{0%,4%{opacity:1}23%,97%{opacity:0}100%{opacity:1}}@keyframes fill0{0%,2%{transform:scaleX(0)}23%,97%{transform:scaleX(1)}100%{transform:scaleX(0)}}.after.d0{animation-name:done0}.before.d0{animation-name:pending0}.grow.d0{animation-name:fill0}
@keyframes done1{0%,29%{opacity:0}48%,97%{opacity:1}100%{opacity:0}}@keyframes pending1{0%,29%{opacity:1}48%,97%{opacity:0}100%{opacity:1}}@keyframes fill1{0%,27%{transform:scaleX(0)}48%,97%{transform:scaleX(1)}100%{transform:scaleX(0)}}.after.d1{animation-name:done1}.before.d1{animation-name:pending1}.grow.d1{animation-name:fill1}
@keyframes done2{0%,54%{opacity:0}73%,97%{opacity:1}100%{opacity:0}}@keyframes pending2{0%,54%{opacity:1}73%,97%{opacity:0}100%{opacity:1}}@keyframes fill2{0%,52%{transform:scaleX(0)}73%,97%{transform:scaleX(1)}100%{transform:scaleX(0)}}.after.d2{animation-name:done2}.before.d2{animation-name:pending2}.grow.d2{animation-name:fill2}
@keyframes done3{0%,79%{opacity:0}94%,97%{opacity:1}100%{opacity:0}}@keyframes pending3{0%,79%{opacity:1}94%,97%{opacity:0}100%{opacity:1}}@keyframes fill3{0%,77%{transform:scaleX(0)}94%,97%{transform:scaleX(1)}100%{transform:scaleX(0)}}.after.d3{animation-name:done3}.before.d3{animation-name:pending3}.grow.d3{animation-name:fill3}
    @keyframes phase0{0%,0.000%{opacity:0}1.600%,23.400%{opacity:1}25.000%,100%{opacity:0}}.p0{animation-name:phase0}.trail.p0{animation-name:phase0,stream;animation-duration:24s,1.4s}
@keyframes phase1{0%,25.000%{opacity:0}26.600%,48.400%{opacity:1}50.000%,100%{opacity:0}}.p1{animation-name:phase1}.trail.p1{animation-name:phase1,stream;animation-duration:24s,1.4s}
@keyframes phase2{0%,50.000%{opacity:0}51.600%,73.400%{opacity:1}75.000%,100%{opacity:0}}.p2{animation-name:phase2}.trail.p2{animation-name:phase2,stream;animation-duration:24s,1.4s}
@keyframes phase3{0%,75.000%{opacity:0}76.600%,98.400%{opacity:1}100.000%,100%{opacity:0}}.p3{animation-name:phase3}.trail.p3{animation-name:phase3,stream;animation-duration:24s,1.4s}
    @keyframes stream{to{stroke-dashoffset:-54}}
    @keyframes field-wait{0%,69%{opacity:1}70%,98%{opacity:0}100%{opacity:1}}
    @keyframes field-ready{0%,71%{opacity:0}72%,97%{opacity:1}98%,100%{opacity:0}}
    .swap.before{animation-name:field-wait}.swap.after{animation-name:field-ready}
    @media(prefers-reduced-motion:reduce){.phase,.after,.before,.grow{animation:none}.focus{opacity:.28}.trail{display:none}.phase-copy{display:none}.steady,.after{opacity:1}.before,.moving-dot{display:none}.grow{transform:scaleX(1)}}
    @media print{.phase,.after,.before,.grow{animation:none}.focus{opacity:.28}.trail,.phase-copy,.before,.moving-dot{display:none}.steady,.after{opacity:1}.grow{transform:scaleX(1)}}
  </style>
<rect width="960" height="1485" rx="28" fill="#f5f8fc"/><text x="480" y="54" class="tiny center">KIM SERVICE  /  05</text><text x="480" y="111" class="title center">Separate methods, application, data and UI</text><text x="480" y="157" class="sub center">The task browser prepares a request for the client you choose</text>
<g class="node" data-label="Authoritative components and configuration"><rect x="64" y="208" width="832" height="176" rx="22" fill="#e8eef7" opacity=".7"/><rect x="64" y="205" width="832" height="176" rx="22" fill="#edf3ff" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p0" x="64" y="205" width="832" height="176" rx="22" stroke="#2968e8"/><text x="480" y="256" class="label center">Authoritative components and configuration</text><text x="480" y="307" class="body center">Each component’s capability.json / method.json</text><text x="480" y="349" class="body center">References and examples; config/ owns display options</text></g><path class="route" d="M480 381 V420 H262 V463"/><path class="trail phase p0" d="M480 381 V420 H262 V463" stroke="#2968e8"/><circle class="moving-dot phase p0" r="6" fill="#2968e8"><animateMotion path="M480 381 V420 H262 V463" dur="2.7s" repeatCount="indefinite"/></circle><path d="M255 460 L262 469 L269 460" fill="none" stroke="#2968e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path class="route" d="M480 381 V420 H698 V463"/><path class="trail phase p0" d="M480 381 V420 H698 V463" stroke="#7c56d8"/><circle class="moving-dot phase p0" r="6" fill="#7c56d8"><animateMotion path="M480 381 V420 H698 V463" dur="2.7s" repeatCount="indefinite"/></circle><path d="M691 460 L698 469 L705 460" fill="none" stroke="#7c56d8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path class="route" d="M460 584 H500"/><path class="trail phase p1" d="M460 584 H500" stroke="#0d9488"/><circle class="moving-dot phase p1" r="6" fill="#0d9488"><animateMotion path="M460 584 H500" dur="2.7s" repeatCount="indefinite"/></circle><path d="M486 577L495 584L486 591" fill="none" stroke="#0d9488" stroke-width="3"/><g class="node" data-label="Data layer"><rect x="64" y="478" width="396" height="232" rx="22" fill="#e8eef7" opacity=".7"/><rect x="64" y="475" width="396" height="232" rx="22" fill="#fff" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p1" x="64" y="475" width="396" height="232" rx="22" stroke="#0d9488"/><text x="88" y="526" class="label">Data layer</text><text x="88" y="577" class="body">Build the catalog</text><text x="88" y="619" class="body">Read tasks and config</text><text x="88" y="661" class="body">Use source definitions</text></g><g class="node" data-label="Application layer"><rect x="500" y="478" width="396" height="232" rx="22" fill="#e8eef7" opacity=".7"/><rect x="500" y="475" width="396" height="232" rx="22" fill="#fff" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p1" x="500" y="475" width="396" height="232" rx="22" stroke="#7c56d8"/><text x="524" y="526" class="label">Application layer</text><text x="524" y="577" class="body">Find methods</text><text x="524" y="619" class="body">Build a task request</text><text x="524" y="661" class="body">No model calls here</text></g><path class="route" d="M698 707 V748 H480 V783"/><path class="trail phase p2" d="M698 707 V748 H480 V783" stroke="#7c56d8"/><circle class="moving-dot phase p2" r="6" fill="#7c56d8"><animateMotion path="M698 707 V748 H480 V783" dur="2.7s" repeatCount="indefinite"/></circle><path d="M473 780 L480 789 L487 780" fill="none" stroke="#7c56d8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g class="node" data-label="Presentation layer"><rect x="64" y="798" width="832" height="176" rx="22" fill="#e8eef7" opacity=".7"/><rect x="64" y="795" width="832" height="176" rx="22" fill="#fff" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p2" x="64" y="795" width="832" height="176" rx="22" stroke="#2968e8"/><text x="480" y="846" class="label center">Presentation layer</text><text x="480" y="897" class="body center">Show methods, required materials and the request</text><text x="480" y="939" class="body center">Choose a host, copy the request, see the next step</text></g><path class="route" d="M480 971 V1047"/><path class="trail phase p3" d="M480 971 V1047" stroke="#ce7b24"/><circle class="moving-dot phase p3" r="6" fill="#ce7b24"><animateMotion path="M480 971 V1047" dur="2.7s" repeatCount="indefinite"/></circle><path d="M473 1044 L480 1053 L487 1044" fill="none" stroke="#ce7b24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g class="node" data-label="Your current AI client executes"><rect x="64" y="1068" width="832" height="176" rx="22" fill="#e8eef7" opacity=".7"/><rect x="64" y="1065" width="832" height="176" rx="22" fill="#fff6e9" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p3" x="64" y="1065" width="832" height="176" rx="22" stroke="#ce7b24"/><text x="480" y="1116" class="label center">Your current AI client executes</text><text x="480" y="1167" class="body center">The host owns model, tools, account and permissions</text><text x="480" y="1209" class="body center">Reuse method sources; local helpers check real artifacts</text></g><rect x="48" y="1281" width="864" height="69" rx="18" fill="#eaf0fb"/><text x="480" y="1325" class="note center steady">Shared methods → catalog data → request → your client</text><text x="480" y="1325" class="note center phase-copy phase p0">Read component and configuration sources once</text><text x="480" y="1325" class="note center phase-copy phase p1">Data feeds the catalog; application prepares requests</text><text x="480" y="1325" class="note center phase-copy phase p2">The page presents a complete request to copy</text><text x="480" y="1325" class="note center phase-copy phase p3">The chosen client performs and verifies the work</text><text x="480" y="1398" class="note center">A host choice changes request text; it does not launch or switch a model.</text><text x="480" y="1440" class="note center">Connection settings stay with the chosen host.</text>
</svg>
