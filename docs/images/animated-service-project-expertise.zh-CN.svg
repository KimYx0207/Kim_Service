<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1140" viewBox="0 0 960 1140" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">同一套基础，各项目自己的专业能力</title><desc id="desc">通用方法带进项目，再结合实际业务形成专业规则. 主要步骤与连接始终显示；动画解释顺序与状态变化，减少动态效果时显示完整结果。</desc>
<style>
    text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17263f}
    .title{font-size:40px;font-weight:700;letter-spacing:-.5px}.sub{font-size:26px;fill:#566782}
    .label{font-size:36px;font-weight:700}.body{font-size:32px}.note{font-size:28px;fill:#566782}
    .tiny{font-size:22px;fill:#566782}.center{text-anchor:middle}
    .route{fill:none;stroke:#dbe4f0;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .focus{fill:none;stroke-width:4;opacity:0}.trail{fill:none;stroke-width:5;stroke-linecap:round;stroke-dasharray:16 11;opacity:0}
    .phase-copy,.moving-dot{opacity:0}.steady{opacity:0}.phase{animation-duration:24s;animation-iteration-count:infinite;animation-timing-function:linear;animation-fill-mode:both}
    .after{opacity:0;animation-duration:24s;animation-iteration-count:infinite}.before{animation-duration:24s;animation-iteration-count:infinite}.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation-duration:24s;animation-iteration-count:infinite}
    @keyframes done0{0%,4%{opacity:0}23%,97%{opacity:1}100%{opacity:0}}@keyframes pending0{0%,4%{opacity:1}23%,97%{opacity:0}100%{opacity:1}}@keyframes fill0{0%,2%{transform:scaleX(0)}23%,97%{transform:scaleX(1)}100%{transform:scaleX(0)}}.after.d0{animation-name:done0}.before.d0{animation-name:pending0}.grow.d0{animation-name:fill0}
@keyframes done1{0%,29%{opacity:0}48%,97%{opacity:1}100%{opacity:0}}@keyframes pending1{0%,29%{opacity:1}48%,97%{opacity:0}100%{opacity:1}}@keyframes fill1{0%,27%{transform:scaleX(0)}48%,97%{transform:scaleX(1)}100%{transform:scaleX(0)}}.after.d1{animation-name:done1}.before.d1{animation-name:pending1}.grow.d1{animation-name:fill1}
@keyframes done2{0%,54%{opacity:0}73%,97%{opacity:1}100%{opacity:0}}@keyframes pending2{0%,54%{opacity:1}73%,97%{opacity:0}100%{opacity:1}}@keyframes fill2{0%,52%{transform:scaleX(0)}73%,97%{transform:scaleX(1)}100%{transform:scaleX(0)}}.after.d2{animation-name:done2}.before.d2{animation-name:pending2}.grow.d2{animation-name:fill2}
@keyframes done3{0%,79%{opacity:0}94%,97%{opacity:1}100%{opacity:0}}@keyframes pending3{0%,79%{opacity:1}94%,97%{opacity:0}100%{opacity:1}}@keyframes fill3{0%,77%{transform:scaleX(0)}94%,97%{transform:scaleX(1)}100%{transform:scaleX(0)}}.after.d3{animation-name:done3}.before.d3{animation-name:pending3}.grow.d3{animation-name:fill3}
    @keyframes phase0{0%,0.000%{opacity:0}1.600%,23.400%{opacity:1}25.000%,100%{opacity:0}}.p0{animation-name:phase0}.trail.p0{animation-name:phase0,stream;animation-duration:24s,1.4s}
@keyframes phase1{0%,25.000%{opacity:0}26.600%,48.400%{opacity:1}50.000%,100%{opacity:0}}.p1{animation-name:phase1}.trail.p1{animation-name:phase1,stream;animation-duration:24s,1.4s}
@keyframes phase2{0%,50.000%{opacity:0}51.600%,73.400%{opacity:1}75.000%,100%{opacity:0}}.p2{animation-name:phase2}.trail.p2{animation-name:phase2,stream;animation-duration:24s,1.4s}
@keyframes phase3{0%,75.000%{opacity:0}76.600%,98.400%{opacity:1}100.000%,100%{opacity:0}}.p3{animation-name:phase3}.trail.p3{animation-name:phase3,stream;animation-duration:24s,1.4s}
    @keyframes stream{to{stroke-dashoffset:-54}}
    @keyframes field-wait{0%,69%{opacity:1}70%,98%{opacity:0}100%{opacity:1}}
    @keyframes field-ready{0%,71%{opacity:0}72%,97%{opacity:1}98%,100%{opacity:0}}
    .swap.before{animation-name:field-wait}.swap.after{animation-name:field-ready}
    @media(prefers-reduced-motion:reduce){.phase,.after,.before,.grow{animation:none}.focus{opacity:.28}.trail{display:none}.phase-copy{display:none}.steady,.after{opacity:1}.before,.moving-dot{display:none}.grow{transform:scaleX(1)}}
    @media print{.phase,.after,.before,.grow{animation:none}.focus{opacity:.28}.trail,.phase-copy,.before,.moving-dot{display:none}.steady,.after{opacity:1}.grow{transform:scaleX(1)}}
  </style>
<rect width="960" height="1140" rx="28" fill="#f5f8fc"/><text x="480" y="54" class="tiny center">KIM SERVICE  /  06</text><text x="480" y="111" class="title center">同一套基础，各项目自己的专业能力</text><text x="480" y="157" class="sub center">通用方法带进项目，再结合实际业务形成专业规则</text>
<g class="node" data-label="全局专业基础"><rect x="64" y="208" width="832" height="150" rx="22" fill="#e8eef7" opacity=".7"/><rect x="64" y="205" width="832" height="150" rx="22" fill="#fff" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p0" x="64" y="205" width="832" height="150" rx="22" stroke="#2968e8"/><text x="480" y="256" class="label center">全局专业基础</text><text x="480" y="309" class="note center">调查取证 · 方案比较 · 设计原则 · 结果核验</text></g><path class="route" d="M480 355 V396 H262 V437"/><path class="trail phase p1" d="M480 355 V396 H262 V437" stroke="#0d9488"/><circle class="moving-dot phase p1" r="6" fill="#0d9488"><animateMotion path="M480 355 V396 H262 V437" dur="2.7s" repeatCount="indefinite"/></circle><path class="route" d="M480 355 V396 H698 V437"/><path class="trail phase p1" d="M480 355 V396 H698 V437" stroke="#7c56d8"/><circle class="moving-dot phase p1" r="6" fill="#7c56d8"><animateMotion path="M480 355 V396 H698 V437" dur="2.7s" repeatCount="indefinite"/></circle><path d="M255 434 L262 443 L269 434" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M691 434 L698 443 L705 434" fill="none" stroke="#7c56d8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g class="node" data-label="设备维护项目"><rect x="64" y="452" width="396" height="190" rx="22" fill="#e8eef7" opacity=".7"/><rect x="64" y="449" width="396" height="190" rx="22" fill="#fff" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p1" x="64" y="449" width="396" height="190" rx="22" stroke="#0d9488"/><text x="88" y="500" class="label">设备维护项目</text><text x="88" y="553" class="note">工况与单位</text><text x="88" y="594" class="note">故障、告警与维修路径</text></g><path class="route" d="M262 639 V693"/><path class="trail phase p2" d="M262 639 V693" stroke="#0d9488"/><circle class="moving-dot phase p2" r="6" fill="#0d9488"><animateMotion path="M262 639 V693" dur="2.7s" repeatCount="indefinite"/></circle><path d="M255 690 L262 699 L269 690" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g class="node" data-label="项目 Agent / Skill"><rect x="64" y="708" width="396" height="190" rx="22" fill="#e8eef7" opacity=".7"/><rect x="64" y="705" width="396" height="190" rx="22" fill="#fff" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p2" x="64" y="705" width="396" height="190" rx="22" stroke="#0d9488"/><text x="88" y="756" class="label">项目 Agent / Skill</text><text x="88" y="809" class="note">设备领域规则与工具</text><text x="88" y="850" class="note">独立版本与验收案例</text></g><g class="node" data-label="国风服装项目"><rect x="500" y="452" width="396" height="190" rx="22" fill="#e8eef7" opacity=".7"/><rect x="500" y="449" width="396" height="190" rx="22" fill="#fff" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p1" x="500" y="449" width="396" height="190" rx="22" stroke="#7c56d8"/><text x="524" y="500" class="label">国风服装项目</text><text x="524" y="553" class="note">品牌与版型</text><text x="524" y="594" class="note">尺码、库存与购买路径</text></g><path class="route" d="M698 639 V693"/><path class="trail phase p2" d="M698 639 V693" stroke="#7c56d8"/><circle class="moving-dot phase p2" r="6" fill="#7c56d8"><animateMotion path="M698 639 V693" dur="2.7s" repeatCount="indefinite"/></circle><path d="M691 690 L698 699 L705 690" fill="none" stroke="#7c56d8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g class="node" data-label="项目 Agent / Skill"><rect x="500" y="708" width="396" height="190" rx="22" fill="#e8eef7" opacity=".7"/><rect x="500" y="705" width="396" height="190" rx="22" fill="#fff" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p2" x="500" y="705" width="396" height="190" rx="22" stroke="#7c56d8"/><text x="524" y="756" class="label">项目 Agent / Skill</text><text x="524" y="809" class="note">品牌和商品体验规则</text><text x="524" y="850" class="note">独立版本与验收案例</text></g><rect x="48" y="937" width="864" height="69" rx="18" fill="#eaf0fb"/><text x="480" y="981" class="note center">全局保留通用基础 · 项目维护自己的专业能力</text><text x="480" y="1060" class="note center">通用、领域、品牌和任务规则共同进入实际交付。</text><text x="480" y="1102" class="note center">更新上游方法时审查差异，保留项目已积累的规则。</text>
</svg>
