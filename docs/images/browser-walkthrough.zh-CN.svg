<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="860" viewBox="0 0 1000 860" lang="zh-CN" xml:lang="zh-CN" role="img" aria-labelledby="title desc">
<title id="title">从选中任务，到一份能直接用的请求。</title><desc id="desc">操作示例：给一家门店做未来 12 个月的现金预测。</desc>
