<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1410" viewBox="0 0 960 1410" role="img" aria-labelledby="title desc" lang="en">
<title id="title">From intent to a checked result</title><desc id="desc">Use current evidence and preserve valid choices. Main steps and connections stay visible. Animation explains order and state changes; reduced motion displays the complete result.</desc>
<style>
    text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17263f}
    .title{font-size:40px;font-weight:700;letter-spacing:-.5px}.sub{font-size:26px;fill:#566782}
    .label{font-size:36px;font-weight:700}.body{font-size:32px}.note{font-size:28px;fill:#566782}
    .tiny{font-size:22px;fill:#566782}.center{text-anchor:middle}
    .route{fill:none;stroke:#dbe4f0;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .focus{fill:none;stroke-width:4;opacity:0}.trail{fill:none;stroke-width:5;stroke-linecap:round;stroke-dasharray:16 11;opacity:0}
    .phase-copy,.moving-dot{opacity:0}.steady{opacity:0}.phase{animation-duration:30s;animation-iteration-count:infinite;animation-timing-function:linear;animation-fill-mode:both}
    .after{opacity:0;animation-duration:30s;animation-iteration-count:infinite}.before{animation-duration:30s;animation-iteration-count:infinite}.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation-duration:30s;animation-iteration-count:infinite}
    @keyframes done0{0%,4%{opacity:0}14.666666666666668%,97%{opacity:1}100%{opacity:0}}@keyframes pending0{0%,4%{opacity:1}14.666666666666668%,97%{opacity:0}100%{opacity:1}}@keyframes fill0{0%,2%{transform:scaleX(0)}14.666666666666668%,97%{transform:scaleX(1)}100%{transform:scaleX(0)}}.after.d0{animation-name:done0}.before.d0{animation-name:pending0}.grow.d0{animation-name:fill0}
@keyframes done1{0%,20.666666666666668%{opacity:0}31.333333333333336%,97%{opacity:1}100%{opacity:0}}@keyframes pending1{0%,20.666666666666668%{opacity:1}31.333333333333336%,97%{opacity:0}100%{opacity:1}}@keyframes fill1{0%,18.666666666666668%{transform:scaleX(0)}31.333333333333336%,97%{transform:scaleX(1)}100%{transform:scaleX(0)}}.after.d1{animation-name:done1}.before.d1{animation-name:pending1}.grow.d1{animation-name:fill1}
@keyframes done2{0%,37.333333333333336%{opacity:0}48%,97%{opacity:1}100%{opacity:0}}@keyframes pending2{0%,37.333333333333336%{opacity:1}48%,97%{opacity:0}100%{opacity:1}}@keyframes fill2{0%,35.333333333333336%{transform:scaleX(0)}48%,97%{transform:scaleX(1)}100%{transform:scaleX(0)}}.after.d2{animation-name:done2}.before.d2{animation-name:pending2}.grow.d2{animation-name:fill2}
@keyframes done3{0%,54%{opacity:0}64.66666666666667%,97%{opacity:1}100%{opacity:0}}@keyframes pending3{0%,54%{opacity:1}64.66666666666667%,97%{opacity:0}100%{opacity:1}}@keyframes fill3{0%,52%{transform:scaleX(0)}64.66666666666667%,97%{transform:scaleX(1)}100%{transform:scaleX(0)}}.after.d3{animation-name:done3}.before.d3{animation-name:pending3}.grow.d3{animation-name:fill3}
@keyframes done4{0%,70.66666666666667%{opacity:0}81.33333333333333%,97%{opacity:1}100%{opacity:0}}@keyframes pending4{0%,70.66666666666667%{opacity:1}81.33333333333333%,97%{opacity:0}100%{opacity:1}}@keyframes fill4{0%,68.66666666666667%{transform:scaleX(0)}81.33333333333333%,97%{transform:scaleX(1)}100%{transform:scaleX(0)}}.after.d4{animation-name:done4}.before.d4{animation-name:pending4}.grow.d4{animation-name:fill4}
@keyframes done5{0%,87.33333333333333%{opacity:0}94%,97%{opacity:1}100%{opacity:0}}@keyframes pending5{0%,87.33333333333333%{opacity:1}94%,97%{opacity:0}100%{opacity:1}}@keyframes fill5{0%,85.33333333333333%{transform:scaleX(0)}94%,97%{transform:scaleX(1)}100%{transform:scaleX(0)}}.after.d5{animation-name:done5}.before.d5{animation-name:pending5}.grow.d5{animation-name:fill5}
    @keyframes phase0{0%,0.000%{opacity:0}1.600%,15.067%{opacity:1}16.667%,100%{opacity:0}}.p0{animation-name:phase0}.trail.p0{animation-name:phase0,stream;animation-duration:30s,1.4s}
@keyframes phase1{0%,16.667%{opacity:0}18.267%,31.733%{opacity:1}33.333%,100%{opacity:0}}.p1{animation-name:phase1}.trail.p1{animation-name:phase1,stream;animation-duration:30s,1.4s}
@keyframes phase2{0%,33.333%{opacity:0}34.933%,48.400%{opacity:1}50.000%,100%{opacity:0}}.p2{animation-name:phase2}.trail.p2{animation-name:phase2,stream;animation-duration:30s,1.4s}
@keyframes phase3{0%,50.000%{opacity:0}51.600%,65.067%{opacity:1}66.667%,100%{opacity:0}}.p3{animation-name:phase3}.trail.p3{animation-name:phase3,stream;animation-duration:30s,1.4s}
@keyframes phase4{0%,66.667%{opacity:0}68.267%,81.733%{opacity:1}83.333%,100%{opacity:0}}.p4{animation-name:phase4}.trail.p4{animation-name:phase4,stream;animation-duration:30s,1.4s}
@keyframes phase5{0%,83.333%{opacity:0}84.933%,98.400%{opacity:1}100.000%,100%{opacity:0}}.p5{animation-name:phase5}.trail.p5{animation-name:phase5,stream;animation-duration:30s,1.4s}
    @keyframes stream{to{stroke-dashoffset:-54}}
    @keyframes field-wait{0%,69%{opacity:1}70%,98%{opacity:0}100%{opacity:1}}
    @keyframes field-ready{0%,71%{opacity:0}72%,97%{opacity:1}98%,100%{opacity:0}}
    .swap.before{animation-name:field-wait}.swap.after{animation-name:field-ready}
    @media(prefers-reduced-motion:reduce){.phase,.after,.before,.grow{animation:none}.focus{opacity:.28}.trail{display:none}.phase-copy{display:none}.steady,.after{opacity:1}.before,.moving-dot{display:none}.grow{transform:scaleX(1)}}
    @media print{.phase,.after,.before,.grow{animation:none}.focus{opacity:.28}.trail,.phase-copy,.before,.moving-dot{display:none}.steady,.after{opacity:1}.grow{transform:scaleX(1)}}
