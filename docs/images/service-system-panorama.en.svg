s="moving-dot phase p4" r="6" fill="#ce7b24"><animateMotion path="M698 775 V811 H480" dur="2.7s" repeatCount="indefinite"/></circle><path d="M473 837 L480 846 L487 837" fill="none" stroke="#2968e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path class="route" d="M480 995 V1043"/><path class="trail phase p5" d="M480 995 V1043" stroke="#0d9488"/><circle class="moving-dot phase p5" r="6" fill="#0d9488"><animateMotion path="M480 995 V1043" dur="2.7s" repeatCount="indefinite"/></circle><path d="M473 1041 L480 1050 L487 1041" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path class="route" d="M896 1125 H931 V923 H903"/><path class="trail phase p5" d="M896 1125 H931 V923 H903" stroke="#ce7b24"/><circle class="moving-dot phase p5" r="6" fill="#ce7b24"><animateMotion path="M896 1125 H931 V923 H903" dur="2.7s" repeatCount="indefinite"/></circle><path d="M911 916 L903 923 L911 930" fill="none" stroke="#ce7b24" stroke-width="3"/><text x="925" y="1029" transform="rotate(-90 925 1029)" class="tiny center" style="fill:#ce7b24">Repair</text><g class="node" data-label="State the goal in your current Agent"><rect x="64" y="208" width="832" height="105" rx="22" fill="#e8eef7" opacity=".7"/><rect x="64" y="205" width="832" height="105" rx="22" fill="#edf3ff" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p0" x="64" y="205" width="832" height="105" rx="22" stroke="#2968e8"/><text x="480" y="248" class="strategy-label center">State the goal in your current Agent</text><text x="480" y="291" class="strategy-body center">Bring materials, constraints and existing decisions</text></g><g class="node" data-label="Research now"><rect x="64" y="368" width="396" height="190" rx="22" fill="#e8eef7" opacity=".7"/><rect x="64" y="365" width="396" height="190" rx="22" fill="#fff" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p1" x="64" y="365" width="396" height="190" rx="22" stroke="#2968e8"/><text x="88" y="408" class="strategy-label">Research now</text><text x="88" y="451" class="strategy-body">Current official sources</text><text x="88" y="485" class="strategy-body">External code and tests</text><text x="88" y="519" class="strategy-body">Dates, versions and reasons</text></g><g class="node" data-label="Compare viable routes"><rect x="500" y="368" width="396" height="190" rx="22" fill="#e8eef7" opacity=".7"/><rect x="500" y="365" width="396" height="190" rx="22" fill="#fff" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p2" x="500" y="365" width="396" height="190" rx="22" stroke="#7c56d8"/><text x="524" y="408" class="strategy-label">Compare viable routes</text><text x="524" y="451" class="strategy-body">Buyer and useful outcome</text><text x="524" y="485" class="strategy-body">Costs, conditions, unknowns</text><text x="524" y="519" class="strategy-body">Recommendation and tradeoffs</text></g><g class="node" data-label="An existing valid choice"><rect x="64" y="633" width="396" height="145" rx="22" fill="#e8eef7" opacity=".7"/><rect x="64" y="630" width="396" height="145" rx="22" fill="#edf8f6" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p3" x="64" y="630" width="396" height="145" rx="22" stroke="#0d9488"/><text x="88" y="673" class="strategy-label">An existing valid choice</text><text x="88" y="716" class="strategy-body">Keep the agreed direction</text><text x="88" y="750" class="strategy-body">Continue the relevant work</text></g><g class="node" data-label="A material choice is open"><rect x="500" y="633" width="396" height="145" rx="22" fill="#e8eef7" opacity=".7"/><rect x="500" y="630" width="396" height="145" rx="22" fill="#fff7ed" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p3" x="500" y="630" width="396" height="145" rx="22" stroke="#ce7b24"/><text x="524" y="673" class="strategy-label">A material choice is open</text><text x="524" y="716" class="strategy-body">Show options and tradeoffs</text><text x="524" y="750" class="strategy-body">You choose; work resumes</text></g><g class="node" data-label="Use professional methods in the task"><rect x="64" y="858" width="832" height="140" rx="22" fill="#e8eef7" opacity=".7"/><rect x="64" y="855" width="832" height="140" rx="22" fill="#fff" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p4" x="64" y="855" width="832" height="140" rx="22" stroke="#2968e8"/><text x="480" y="898" class="strategy-label center">Use professional methods in the task</text><text x="480" y="941" class="strategy-body center">Agents / Skills + project rules + available tools</text><text x="480" y="975" class="strategy-body center">Follow dependencies; deliver files, pages or code</text></g><g class="node" data-label="Open the result and check the criteria"><rect x="64" y="1063" width="832" height="140" rx="22" fill="#e8eef7" opacity=".7"/><rect x="64" y="1060" width="832" height="140" rx="22" fill="#edf8f6" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p5" x="64" y="1060" width="832" height="140" rx="22" stroke="#0d9488"/><text x="480" y="1103" class="strategy-label center">Open the result and check the criteria</text><text x="480" y="1146" class="strategy-body center">Pass: keep results, chosen versions and next steps</text><text x="480" y="1180" class="strategy-body center">Problem: return to the affected work and repair it</text></g><rect x="48" y="1230" width="864" height="69" rx="18" fill="#eaf0fb"/><text x="480" y="1274" class="note center steady">Research → compare → decide → execute → verify</text><text x="480" y="1274" class="note center phase-copy phase p0">Start in the current conversation with available materials</text><text x="480" y="1274" class="note center phase-copy phase p1">Read current sources that affect the choice</text><text x="480" y="1274" class="note center phase-copy phase p2">Use evidence to compare routes and recommend</text><text x="480" y="1274" class="note center phase-copy phase p3">Preserve decisions; resolve open material choices</text><text x="480" y="1274" class="note center phase-copy phase p4">The current client executes the relevant methods</text><text x="480" y="1274" class="note center phase-copy phase p5">Inspect the actual result and verify repairs</text><text x="480" y="1340" class="tiny center">Browse the catalog when useful; Meta_Kim schedules complex work.</text><text x="480" y="1371" class="tiny center">An open choice leaves unrelated independent work free to continue.</text>
</svg>
