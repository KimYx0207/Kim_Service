urrent AI client</text><text x="480" y="1804" class="note center phase-copy phase p3">4 / Reconcile inputs, then calculate scenarios</text><text x="480" y="1804" class="note center phase-copy phase p4">5 / Open and recalculate; investigate any gaps</text><text x="480" y="1804" class="note center phase-copy phase p5">6 / Preserve a result you can continue from</text><text x="480" y="1870" class="tiny center">Example assumptions; the AI client performs the work</text>
