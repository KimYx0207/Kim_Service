<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180" role="img" aria-labelledby="title desc" lang="zh-CN" xml:lang="zh-CN">
<title id="title">从一个经营问题，走到能修改的成果</title><desc id="desc">先选任务、准备材料，再让你的 AI 把工作做出来。</desc>
<style>text{font-family:Inter, Noto Sans CJK SC, sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#23765b" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="1180" rx="24" fill="#f7f9f5"/>
<text x="48" y="48" font-size="19" font-weight="750" fill="#23765b" text-anchor="start"><tspan x="48" dy="0">KIM SERVICE / 操作流程</tspan></text>
<text x="48" y="103" font-size="38" font-weight="750" fill="#17372f" text-anchor="start"><tspan x="48" dy="0">从一个经营问题，走到能修改的成果</tspan></text>
<text x="48" y="146" font-size="24" font-weight="450" fill="#52665e" text-anchor="start"><tspan x="48" dy="0">先选任务、准备材料，再让你的 AI 把工作做出来。</tspan></text>
<rect x="65" y="185" width="1070" height="80" rx="18" fill="#e7f1e9" stroke="#cedbd1" stroke-width="2"/>
<text x="600" y="237" font-size="30" font-weight="650" fill="#17372f" text-anchor="middle"><tspan x="600" dy="0">我想知道：未来一年现金够用吗？</tspan></text>
<rect x="65" y="322" width="470" height="210" rx="18" fill="white" stroke="#cedbd1" stroke-width="2"/>
<text x="92" y="364" font-size="23" font-weight="750" fill="#bb633e" text-anchor="start"><tspan x="92" dy="0">01</tspan></text>
<text x="92" y="409" font-size="29" font-weight="750" fill="#17372f" text-anchor="start"><tspan x="92" dy="0">找到财务建模</tspan></text>
<text x="92" y="455" font-size="24" font-weight="450" fill="#52665e" text-anchor="start"><tspan x="92" dy="0">在任务浏览器里搜索，</tspan><tspan x="92" dy="34.8">点开任务看需要什么。</tspan></text>
<rect x="665" y="322" width="470" height="210" rx="18" fill="white" stroke="#cedbd1" stroke-width="2"/>
<text x="692" y="364" font-size="23" font-weight="750" fill="#bb633e" text-anchor="start"><tspan x="692" dy="0">02</tspan></text>
<text x="692" y="409" font-size="29" font-weight="750" fill="#17372f" text-anchor="start"><tspan x="692" dy="0">填目标和材料</tspan></text>
<text x="692" y="455" font-size="24" font-weight="450" fill="#52665e" text-anchor="start"><tspan x="692" dy="0">写清要比较的情景，</tspan><tspan x="692" dy="34.8">附上销售、成本和回款假设。</tspan></text>
<rect x="665" y="595" width="470" height="210" rx="18" fill="white" stroke="#cedbd1" stroke-width="2"/>
<text x="692" y="637" font-size="23" font-weight="750" fill="#bb633e" text-anchor="start"><tspan x="692" dy="0">03</tspan></text>
<text x="692" y="682" font-size="29" font-weight="750" fill="#17372f" text-anchor="start"><tspan x="692" dy="0">交给你的 AI</tspan></text>
<text x="692" y="728" font-size="24" font-weight="450" fill="#52665e" text-anchor="start"><tspan x="692" dy="0">选择客户端，复制请求。</tspan><tspan x="692" dy="34.8">AI 读取方法和材料，完成工作。</tspan></text>
<rect x="65" y="595" width="470" height="210" rx="18" fill="white" stroke="#cedbd1" stroke-width="2"/>
<text x="92" y="637" font-size="23" font-weight="750" fill="#bb633e" text-anchor="start"><tspan x="92" dy="0">04</tspan></text>
<text x="92" y="682" font-size="29" font-weight="750" fill="#17372f" text-anchor="start"><tspan x="92" dy="0">打开结果试一试</tspan></text>
<text x="92" y="728" font-size="24" font-weight="450" fill="#52665e" text-anchor="start"><tspan x="92" dy="0">改一个假设，看曲线变化。</tspan><tspan x="92" dy="34.8">下载月表，继续核对和分析。</tspan></text>
<path d="M540 426H650" fill="none" stroke="#23765b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M900 536V580" fill="none" stroke="#23765b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M660 700H550" fill="none" stroke="#23765b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M300 810V846H600V890" fill="none" stroke="#23765b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="155" y="910" width="890" height="145" rx="18" fill="#e7f1e9" stroke="#cedbd1" stroke-width="2"/>
<path d="M179 936v93" stroke="#23765b" stroke-width="5"/>
<text x="201" y="961" font-size="29" font-weight="700" fill="#17372f" text-anchor="start"><tspan x="201" dy="0">交付可以带走的东西</tspan></text>
<text x="201" y="1004" font-size="23" font-weight="450" fill="#52665e" text-anchor="start"><tspan x="201" dy="0">模型输入与结果 JSON  ·  月度 CSV  ·  说明与源码</tspan></text>
<text x="600" y="1121" font-size="21" font-weight="450" fill="#52665e" text-anchor="middle"><tspan x="600" dy="0">README 中的页面截图来自可交互的合成数据示例。</tspan></text>
</svg>
