<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1485" viewBox="0 0 960 1485" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">方法、应用、数据和展示分开维护</title><desc id="desc">任务浏览器生成请求，再交给你选择的客户端执行. 主要步骤与连接始终显示；动画解释顺序与状态变化，减少动态效果时显示完整结果。</desc>
<style>
    text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17263f}
    .title{font-size:40px;font-weight:700;letter-spacing:-.5px}.sub{font-size:26px;fill:#566782}
    .label{font-size:36px;font-weight:700}.body{font-size:32px}.note{font-size:28px;fill:#566782}
    .tiny{font-size:22px;fill:#566782}.center{text-anchor:middle}
    .route{fill:none;stroke:#dbe4f0;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .focus{fill:none;stroke-width:4;opacity:0}.trail{fill:none;stroke-width:5;stroke-linecap:round;stroke-dasharray:16 11;opacity:0}
    .phase-copy,.moving-dot{opacity:0}.steady{opacity:0}.phase{animation-duration:24s;animation-iteration-count:infinite;animation-timing-function:linear;animation-fill-mode:both}
    .after{opacity:0;animation-duration:24s;animation-iteration-count:infinite}.before{animation-duration:24s;animation-iteration-count:infinite}.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation-duration:24s;animation-iteration-count:infinite}
    @keyframes done0{0%,4%{opacity:0}23%,97%{opacity:1}100%{opacity:0}}@keyframes pending0{0%,4%{opacity:1}23%,97%{opacity:0}100%{opacity:1}}@keyframes fill0{0%,2%{transform:scaleX(0)}23%,97%{transform:scaleX(1)}100%{transform:scaleX(0)}}.after.d0{animation-name:done0}.before.d0{animation-name:pending0}.grow.d0{animation-name:fill0}
@keyframes done1{0%,29%{opacity:0}48%,97%{opacity:1}100%{opacity:0}}@keyframes pending1{0%,29%{opacity:1}48%,97%{opacity:0}100%{opacity:1}}@keyframes fill1{0%,27%{transform:scaleX(0)}48%,97%{transform:scaleX(1)}100%{transform:scaleX(0)}}.after.d1{animation-name:done1}.before.d1{animation-name:pending1}.grow.d1{animation-name:fill1}
@keyframes done2{0%,54%{opacity:0}73%,97%{opacity:1}100%{opacity:0}}@keyframes pending2{0%,54%{opacity:1}73%,97%{opacity:0}100%{opacity:1}}@keyframes fill2{0%,52%{transform:scaleX(0)}73%,97%{transform:scaleX(1)}100%{transform:scaleX(0)}}.after.d2{animation-name:done2}.before.d2{animation-name:pending2}.grow.d2{animation-name:fill2}
@keyframes done3{0%,79%{opacity:0}94%,97%{opacity:1}100%{opacity:0}}@keyframes pending3{0%,79%{opacity:1}94%,97%{opacity:0}100%{opacity:1}}@keyframes fill3{0%,77%{transform:scaleX(0)}94%,97%{transform:scaleX(1)}100%{transform:scaleX(0)}}.after.d3{animation-name:done3}.before.d3{animation-name:pending3}.grow.d3{animation-name:fill3}
    @keyframes phase0{0%,0.000%{opacity:0}1.600%,23.400%{opacity:1}25.000%,100%{opacity:0}}.p0{animation-name:phase0}.trail.p0{animation-name:phase0,stream;animation-duration:24s,1.4s}
@keyframes phase1{0%,25.000%{opacity:0}26.600%,48.400%{opacity:1}50.000%,100%{opacity:0}}.p1{animation-name:phase1}.trail.p1{animation-name:phase1,stream;animation-duration:24s,1.4s}
@keyframes phase2{0%,50.000%{opacity:0}51.600%,73.400%{opacity:1}75.000%,100%{opacity:0}}.p2{animation-name:phase2}.trail.p2{animation-name:phase2,stream;animation-duration:24s,1.4s}
@keyframes phase3{0%,75.000%{opacity:0}76.600%,98.400%{opacity:1}100.000%,100%{opacity:0}}.p3{animation-name:phase3}.trail.p3{animation-name:phase3,stream;animation-duration:24s,1.4s}
    @keyframes stream{to{stroke-dashoffset:-54}}
    @keyframes field-wait{0%,69%{opacity:1}70%,98%{opacity:0}100%{opacity:1}}
    @keyframes field-ready{0%,71%{opacity:0}72%,97%{opacity:1}98%,100%{opacity:0}}
    .swap.before{animation-name:field-wait}.swap.after{animation-name:field-ready}
    @media(prefers-reduced-motion:reduce){.phase,.after,.before,.grow{animation:none}.focus{opacity:.28}.trail{display:none}.phase-copy{display:none}.steady,.after{opacity:1}.before,.moving-dot{display:none}.grow{transform:scaleX(1)}}
    @media print{.phase,.after,.before,.grow{animation:none}.focus{opacity:.28}.trail,.phase-copy,.before,.moving-dot{display:none}.steady,.after{opacity:1}.grow{transform:scaleX(1)}}
  </style>
<rect width="960" height="1485" rx="28" fill="#f5f8fc"/><text x="480" y="54" class="tiny center">KIM SERVICE  /  05</text><text x="480" y="111" class="title center">方法、应用、数据和展示分开维护</text><text x="480" y="157" class="sub center">任务浏览器生成请求，再交给你选择的客户端执行</text>
<g class="node" data-label="组件与配置的权威来源"><rect x="64" y="208" width="832" height="176" rx="22" fill="#e8eef7" opacity=".7"/><rect x="64" y="205" width="832" height="176" rx="22" fill="#edf3ff" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p0" x="64" y="205" width="832" height="176" rx="22" stroke="#2968e8"/><text x="480" y="256" class="label center">组件与配置的权威来源</text><text x="480" y="307" class="body center">各组件的 capability.json / method.json</text><text x="480" y="349" class="body center">专业资料与案例；config/ 管理展示选项</text></g><path class="route" d="M480 381 V420 H262 V463"/><path class="trail phase p0" d="M480 381 V420 H262 V463" stroke="#2968e8"/><circle class="moving-dot phase p0" r="6" fill="#2968e8"><animateMotion path="M480 381 V420 H262 V463" dur="2.7s" repeatCount="indefinite"/></circle><path d="M255 460 L262 469 L269 460" fill="none" stroke="#2968e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path class="route" d="M480 381 V420 H698 V463"/><path class="trail phase p0" d="M480 381 V420 H698 V463" stroke="#7c56d8"/><circle class="moving-dot phase p0" r="6" fill="#7c56d8"><animateMotion path="M480 381 V420 H698 V463" dur="2.7s" repeatCount="indefinite"/></circle><path d="M691 460 L698 469 L705 460" fill="none" stroke="#7c56d8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path class="route" d="M460 584 H500"/><path class="trail phase p1" d="M460 584 H500" stroke="#0d9488"/><circle class="moving-dot phase p1" r="6" fill="#0d9488"><animateMotion path="M460 584 H500" dur="2.7s" repeatCount="indefinite"/></circle><path d="M486 577L495 584L486 591" fill="none" stroke="#0d9488" stroke-width="3"/><g class="node" data-label="数据层"><rect x="64" y="478" width="396" height="232" rx="22" fill="#e8eef7" opacity=".7"/><rect x="64" y="475" width="396" height="232" rx="22" fill="#fff" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p1" x="64" y="475" width="396" height="232" rx="22" stroke="#0d9488"/><text x="88" y="526" class="label">数据层</text><text x="88" y="577" class="body">读取并生成能力目录</text><text x="88" y="619" class="body">载入任务与配置数据</text><text x="88" y="661" class="body">不另写一套方法定义</text></g><g class="node" data-label="应用层"><rect x="500" y="478" width="396" height="232" rx="22" fill="#e8eef7" opacity=".7"/><rect x="500" y="475" width="396" height="232" rx="22" fill="#fff" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p1" x="500" y="475" width="396" height="232" rx="22" stroke="#7c56d8"/><text x="524" y="526" class="label">应用层</text><text x="524" y="577" class="body">搜索、筛选、组合方法</text><text x="524" y="619" class="body">生成完整任务请求</text><text x="524" y="661" class="body">不在这里调用模型</text></g><path class="route" d="M698 707 V748 H480 V783"/><path class="trail phase p2" d="M698 707 V748 H480 V783" stroke="#7c56d8"/><circle class="moving-dot phase p2" r="6" fill="#7c56d8"><animateMotion path="M698 707 V748 H480 V783" dur="2.7s" repeatCount="indefinite"/></circle><path d="M473 780 L480 789 L487 780" fill="none" stroke="#7c56d8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g class="node" data-label="展示层"><rect x="64" y="798" width="832" height="176" rx="22" fill="#e8eef7" opacity=".7"/><rect x="64" y="795" width="832" height="176" rx="22" fill="#fff" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p2" x="64" y="795" width="832" height="176" rx="22" stroke="#2968e8"/><text x="480" y="846" class="label center">展示层</text><text x="480" y="897" class="body center">任务浏览器呈现说明、材料要求和请求</text><text x="480" y="939" class="body center">选择宿主、复制请求，保留清楚的下一步</text></g><path class="route" d="M480 971 V1047"/><path class="trail phase p3" d="M480 971 V1047" stroke="#ce7b24"/><circle class="moving-dot phase p3" r="6" fill="#ce7b24"><animateMotion path="M480 971 V1047" dur="2.7s" repeatCount="indefinite"/></circle><path d="M473 1044 L480 1053 L487 1044" fill="none" stroke="#ce7b24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g class="node" data-label="当前 AI 客户端执行"><rect x="64" y="1068" width="832" height="176" rx="22" fill="#e8eef7" opacity=".7"/><rect x="64" y="1065" width="832" height="176" rx="22" fill="#fff6e9" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p3" x="64" y="1065" width="832" height="176" rx="22" stroke="#ce7b24"/><text x="480" y="1116" class="label center">当前 AI 客户端执行</text><text x="480" y="1167" class="body center">宿主负责模型、工具、账户和权限</text><text x="480" y="1209" class="body center">方法包沿用同一份；本地 helper 核对实际产物</text></g><rect x="48" y="1281" width="864" height="69" rx="18" fill="#eaf0fb"/><text x="480" y="1325" class="note center steady">共享方法 → 目录数据 → 任务请求 → 当前客户端</text><text x="480" y="1325" class="note center phase-copy phase p0">从组件和配置读取事实，不维护第二份清单</text><text x="480" y="1325" class="note center phase-copy phase p1">数据层提供目录；应用层筛选和生成请求</text><text x="480" y="1325" class="note center phase-copy phase p2">页面呈现结果，使用者复制完整请求</text><text x="480" y="1325" class="note center phase-copy phase p3">所选客户端按真实能力执行和检查</text><text x="480" y="1398" class="note center">客户端选项表达请求意图；不会在网页中启动或切换真实模型。</text><text x="480" y="1440" class="note center">更换宿主时，连接信息仍由宿主配置。</text>
</svg>
