rcle><path class="route" d="M698 1183 V1272 H480"/><path class="trail phase p4" d="M698 1183 V1272 H480" stroke="#ce7b24"/><circle class="moving-dot phase p4" r="6" fill="#ce7b24"><animateMotion path="M698 1183 V1272 H480" dur="2.7s" repeatCount="indefinite"/></circle><path d="M473 1298 L480 1307 L487 1298" fill="none" stroke="#7c56d8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="100" y="1206" width="760" height="51" rx="12" fill="#f5f8fc"/><text x="480" y="1238" class="note center">No adoption record from the host → unknown</text><g class="node" data-label="Keep an internal candidate lesson"><rect x="64" y="1316" width="832" height="166" rx="22" fill="#e8eef7" opacity=".7"/><rect x="64" y="1313" width="832" height="166" rx="22" fill="#f4f0fb" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p4" x="64" y="1313" width="832" height="166" rx="22" stroke="#7c56d8"/><text x="480" y="1364" class="label center">Keep an internal candidate lesson</text><text x="480" y="1413" class="body center">Sources, conditions, failures and counterexamples</text><text x="480" y="1455" class="body center">Review observed results before using a lesson again</text></g><path class="route" d="M480 1479 V1521"/><path class="trail phase p5" d="M480 1479 V1521" stroke="#0d9488"/><circle class="moving-dot phase p5" r="6" fill="#0d9488"><animateMotion path="M480 1479 V1521" dur="2.7s" repeatCount="indefinite"/></circle><path d="M473 1518 L480 1527 L487 1518" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g class="node" data-label="Select for the next work item"><rect x="64" y="1536" width="832" height="134" rx="22" fill="#e8eef7" opacity=".7"/><rect x="64" y="1533" width="832" height="134" rx="22" fill="#edf8f6" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p5" x="64" y="1533" width="832" height="134" rx="22" stroke="#0d9488"/><text x="480" y="1584" class="label center">Select for the next work item</text><text x="480" y="1633" class="body center">Reuse directly · adapt · mark unsuitable with a reason</text></g><rect x="48" y="1707" width="864" height="69" rx="18" fill="#eaf0fb"/><text x="480" y="1751" class="note center steady">One work item · clear handoff · reasons · conditional reuse</text><text x="480" y="1751" class="note center phase-copy phase p0">Bind the work item and its context revision</text><text x="480" y="1751" class="note center phase-copy phase p1">Choose handoff and SOP methods for the task</text><text x="480" y="1751" class="note center phase-copy phase p2">Check artifacts and four separate outcome records</text><text x="480" y="1751" class="note center phase-copy phase p3">Record adoption from the host; unknown if absent</text><text x="480" y="1751" class="note center phase-copy phase p4">Preserve an internal lesson with traceable sources</text><text x="480" y="1751" class="note center phase-copy phase p5">Check conditions before choosing how to reuse</text><text x="480" y="1821" class="note center">Keep internal materials in their original scope.</text><text x="480" y="1860" class="note center">Public methods receive generalized, validated lessons.</text>
