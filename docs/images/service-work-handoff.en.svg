<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img" aria-labelledby="title desc" lang="en"><title id="title">Kim Service · Keep one Work continuous</title><desc id="desc">Keep context with the Work; record production, verification, adoption and impact separately Resume the same Work; Service supplies methods while the host retains business facts, access and decisions.</desc><defs><marker id="main-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#46544a"/></marker><marker id="return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#6756b4"/></marker><marker id="human-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#b96b2a"/></marker><marker id="write-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#7b817c"/></marker><marker id="context-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#dce8dd"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}.edge{vector-effect:non-scaling-stroke}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1440" height="1100" rx="20" fill="#f8f7f2"/><rect x="40" y="152" width="1360" height="152" rx="16" fill="#21362b" stroke="#21362b" stroke-width="1.8"/><rect x="40" y="354" width="1360" height="164" rx="16" fill="#f6f0e4" stroke="#b8bdb5" stroke-width="1.8"/><rect x="40" y="562" width="1360" height="234" rx="16" fill="#e9f3f0" stroke="#b8bdb5" stroke-width="1.8"/><rect x="40" y="816" width="1360" height="128" rx="16" fill="#eff0ed" stroke="#b8bdb5" stroke-width="1.8"/><path class="edge main" d="M290 122H337" fill="none" stroke="#46544a" stroke-width="2.6