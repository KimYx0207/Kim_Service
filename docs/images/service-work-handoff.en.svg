b8bdb5" stroke-width="1.6"/></g><g id="handoff-packet" data-box="64,626,220,72"><rect x="64" y="626" width="220" height="72" rx="10" fill="#fff" stroke="#b8bdb5" stroke-width="1.6"/></g><g id="user-choice" data-box="610,724,380,58"><rect x="610" y="724" width="380" height="58" rx="10" fill="#fff4e3" stroke="#b96b2a" stroke-width="1.6"/></g><g id="version-example" data-box="1084,724,292,58"><rect x="1084" y="724" width="292" height="58" rx="10" fill="#f8faf6" stroke="#b8bdb5" stroke-width="1.6"/></g><g id="next-session" data-box="64,724,220,68"><rect x="64" y="724" width="220" height="68" rx="10" fill="#fff" stroke="#46544a" stroke-width="1.6"/></g><g id="record-effect" data-box="64,869,280,62"><rect x="64" y="869" width="280" height="62" rx="10" fill="#fff" stroke="#b8bdb5" stroke-width="1.6"/></g><g id="record-adopted" data-box="404,869,280,62"><rect x="404" y="869" width="280" height="62" rx="10" fill="#fff" stroke="#b8bdb5" stroke-width="1.6"/></g><g id="record-verified" data-box="744,869,280,62"><rect x="744" y="869" width="280" height="62" rx="10" fill="#fff" stroke="#b8bdb5" stroke-width="1.6"/></g><g id="record-produced" data-box="1084,869,292,62"><rect x="1084" y="869" width="292" height="62" rx="10" fill="#fff" stroke="#b8bdb5" stroke-width="1.6"/></g><g id="observed-feedback" data-box="64,982,280,66"><rect x="64" y="982" width="280" height="66" rx="10" fill="#fff" stroke="#b8bdb5" stroke-width="1.6"/></g><g id="review-feedback" data-box="404,982,280,66"><rect x="404" y="982" width="280" height="66" rx="10" fill="#fff" stroke="#b8bdb5" stroke-width="1.6"/></g><g id="candidate" data-box="744,982,280,66"><rect x="744" y="982" width="280" height="66" rx="10" fill="#fff" stroke="#b8bdb5" stroke-width="1.6"/></g><g id="reuse" data-box="1084,982,292,66"><rect x="1084" y="982" width="292" height="66" rx="10" fill="#21362b" stroke="#21362b" stroke-width="1.6"/></g><text x="720" y="52" fill="#202b24" font-size="36" font-weight="700" text-anchor="middle"><tspan x="720" dy="0">Kim Service · Keep one Work continuous</tspan></text><text x="720" y="91" fill="#5f6a62" font-size="22" font-weight="450" text-anchor="middle"><tspan x="720" dy="0">Keep context with the Work; record production, verification, adoption and impact separately</tspan></text><text x="355" y="128" fill="#5f6a62" font-size="20" font-weight="450" text-anchor="start"><tspan x="355" dy="0">Main flow</tspan></text><text x="570" y="128" fill="#5f6a62" font-size="20" font-weight="450" text-anchor="start"><tspan x="570" dy="0">Return / repair</tspan></text><text x="800" y="128" fill="#5f6a62" font-size="20" font-weight="450" text-anchor="start"><tspan x="800" dy="0">Human decision</tspan></text><text x="1040" y="128" fill="#5f6a62" font-size="20" font-weight="450" text-anchor="start"><tspan x="1040" dy="0">Write records</tspan></text><text x="62" y="190" fill="#fff" font-size="26" font-weight="700" text-anchor="start"><tspan x="62" dy="0">Company Work · The host owns the master record</tspan></text><text x="720" y="218" fill="#dae4db" font-size="21" font-weight="450" text-anchor="middle"><tspan x="720" dy="0">People and sessions may change; the Work remains, with access controlled by the host</tspan></text><text x="219.0" y="268.0" fill="#202b24" font-size="23" font-weight="700" text-anchor="middle"><tspan x="219.0" dy="0">Goal + current context</tspan></text><text x="553.0" y="268.0" fill="#202b24" font-size="23" font-weight="700" text-anchor="middle"><tspan x="553.0" dy="0">Owner + access scope</tspan></text><text x="887.0" y="268.0" fill="#202b24" font-size="23" font-weight="700" text-anchor="middle"><tspan x="887.0" dy="0">Sources + valid decisions</tspan></text><text x="1221.0" y="268.0" fill="#202b24" font-size="22" font-weight="700" text-anchor="middle"><tspan x="1221.0" dy="0">Adopted version + next step</tspan></text><text x="62" y="392" fill="#202b24" font-size="26" font-weight="700" text-anchor="start"><tspan x="62" dy="0"></tspan></text><text x="860" y="392" fill="#202b24" font-size="26" font-weight="700" text-anchor="middle"><tspan x="860" dy="0">Current task · Executed by your AI client</tspan></text><text x="204.0" y="451.0" fill="#202b24" font-size="23" font-weight="700" text-anchor="middle"><tspan x="204.0" dy="0">Bind Work + task inputs</tspan></text><text x="204.0" y="481.0" fill="#5f6a62" font-size="20" font-weight="450" text-anchor="middle"><tspan x="204.0" dy="0">Read context + decisions</tspan></text><text x="544.0" y="451.0" fill="#202b24" font-size="23" font-weight="700" text-anchor="middle"><tspan x="544.0" dy="0">Choose methods</tspan></text><text x="544.0" y="481.0" fill="#5f6a62" font-size="20" font-weight="450" text-anchor="middle"><tspan x="544.0" dy="0">Agent · Skill · Hook · Tool</tspan></text><text x="884.0" y="451.0" fill="#202b24" font-size="23" font-weight="700" text-anchor="middle"><tspan x="884.0" dy="0">Execute the current task</tspan></text><text x="884.0" y="481.0" fill="#5f6a62" font-size="20" font-weight="450" text-anchor="middle"><tspan x="884.0" dy="0">Run in the current client</tspan></text><text x="1230.0" y="451.0" fill="#202b24" font-size="23" font-weight="700" text-anchor="middle"><tspan x="1230.0" dy="0">Produce actual artifacts</tspan></text><text x="1230.0" y="481.0" fill="#5f6a62" font-size="20" font-weight="450" text-anchor="middle"><tspan x="1230.0" dy="0">Version + artifact references</tspan></text><rect x="225.8828125" y="356" width="148.234375" height="26" rx="3" fill="#f8f7f2"/><text x="300" y="376" fill="#46544a" font-size="20" font-weight="450" text-anchor="middle"><tspan x="300" dy="0">Read and bind</tspan></text><text x="62" y="600" fill="#202b24" font-size="26" font-weight="700" text-anchor="start"><tspan x="62" dy="0">Verify, adopt and hand off · Reuse valid decisions</tspan></text><text x="1230.0" y="655.0" fill="#202b24" font-size="23" font-weight="700" text-anchor="middle"><tspan x="1230.0" dy="0">Verify independently</tspan></text><text x="1230.0" y="685.0" fill="#5f6a62" font-size="20" font-weight="450" text-anchor="middle"><tspan x="1230.0" dy="0">Check files and behavior</tspan></text><text x="955.0" y="670.0" fill="#202b24" font-size="22" font-weight="700" text-anchor="middle"><tspan x="955.0" dy="0">Pass?</tspan></text><text x="710.0" y="670.0" fill="#202b24" font-size="22" font-weight="700" text-anchor="middle"><tspan x="710.0" dy="0">Your call?</tspan></text><text x="450.0" y="655.0" fill="#202b24" font-size="23" font-weight="700" text-anchor="middle"><tspan x="450.0" dy="0">Record adoption</tspan></text><text x="450.0" y="685.0" fill="#5f6a62" font-size="20" font-weight="450" text-anchor="middle"><tspan x="450.0" dy="0">Version / pending</tspan></text><text x="174.0" y="655.0" fill="#202b24" font-size="21" font-weight="700" text-anchor="middle"><tspan x="174.0" dy="0">Prepare the handoff</tspan></text><text x="174.0" y="685.0" fill="#5f6a62" font-size="20" font-weight="450" text-anchor="middle"><tspan x="174.0" dy="0">Version + receipt</tspan></text><rect x="817.9296875" y="630" width="44.140625" height="26" rx="3" fill="#f8f7f2"/><text x="840" y="650" fill="#46544a" font-size="20" font-weight="450" text-anchor="middle"><tspan x="840" dy="0">Yes</tspan></text><rect x="564.7109375" y="630" width="40.578125" height="26" rx="3" fill="#f8f7f2"/><text x="585" y="650" fill="#46544a" font-size="20" font-weight="450" text-anchor="middle"><tspan x="585" dy="0">No</tspan></text><rect x="913.453125" y="528" width="267.09375" height="26" rx="3" fill="#f8f7f2"/><text x="1047" y="548" fill="#6756b4" font-size="20" font-weight="450" text-anchor="middle"><tspan x="1047" dy="0">Failed: repair affected work</tspan></text><text x="800.0" y="761.0" fill="#202b24" font-size="23" font-weight="700" text-anchor="middle"><tspan x="800.0" dy="0">Key open choice: your decision</tspan></text><rect x="723.9296875" y="702" width="44.140625" height="26" rx="3" fill="#f8f7f2"/><text x="746" y="722" fill="#b96b2a" font-size="20" font-weight="450" text-anchor="middle"><tspan x="746" dy="0">Yes</tspan></text><text x="1230.0" y="761.0" fill="#202b24" font-size="21" font-weight="700" text-anchor="middle"><tspan x="1230.0" dy="0">Produce v2; still adopt v1</tspan></text><text x="174.0" y="751.0" fill="#202b24" font-size="21" font-weight="700" text-anchor="middle"><tspan x="174.0" dy="0">Next person</tspan><tspan x="174.0" dy="27.3">or next session</tspan></text><rect x="52.1015625" y="319" width="243.796875" height="26" rx="3" fill="#f8f7f2"/><text x="174" y="339" fill="#6756b4" font-size="20" font-weight="450" text-anchor="middle"><tspan x="174" dy="0">Return to the same Work</tspan></text><text x="62" y="854" fill="#202b24" font-size="26" font-weight="700" text-anchor="start"><tspan x="62" dy="0">Four independent observations</tspan></text><text x="204.0" y="893.0" fill="#202b24" font-size="24" font-weight="700" text-anchor="middle"><tspan x="204.0" dy="0">Impact</tspan></text><text x="204.0" y="923.0" fill="#5f6a62" font-size="20" font-weight="450" text-anchor="middle"><tspan x="204.0" dy="0">Observed in actual use</tspan></text><text x="544.0" y="893.0" fill="#202b24" font-size="24" font-weight="700" text-anchor="middle"><tspan x="544.0" dy="0">Adoption</tspan></text><text x="544.0" y="923.0" fill="#5f6a62" font-size="20" font-weight="450" text-anchor="middle"><tspan x="544.0" dy="0">Exact version · reason</tspan></text><text x="884.0" y="893.0" fill="#202b24" font-size="24" font-weight="700" text-anchor="middle"><tspan x="884.0" dy="0">Verification</tspan></text><text x="884.0" y="923.0" fill="#5f6a62" font-size="20" font-weight="450" text-anchor="middle"><tspan x="884.0" dy="0">Criteria · evidence</tspan></text><text x="1230.0" y="893.0" fill="#202b24" font-size="24" font-weight="700" text-anchor="middle"><tspan x="1230.0" dy="0">Production</tspan></text><text x="1230.0" y="923.0" fill="#5f6a62" font-size="20" font-weight="450" text-anchor="middle"><tspan x="1230.0" dy="0">Artifacts · current version</tspan></text><text x="204.0" y="1008.0" fill="#202b24" font-size="23" font-weight="700" text-anchor="middle"><tspan x="204.0" dy="0">Actual-use feedback</tspan></text><text x="204.0" y="1038.0" fill="#5f6a62" font-size="20" font-weight="450" text-anchor="middle"><tspan x="204.0" dy="0">Unknown until observed</tspan></text><text x="544.0" y="1008.0" fill="#202b24" font-size="21" font-weight="700" text-anchor="middle"><tspan x="544.0" dy="0">Review causes + evidence</tspan></text><text x="544.0" y="1038.0" fill="#5f6a62" font-size="20" font-weight="450" text-anchor="middle"><tspan x="544.0" dy="0">Find a reusable approach</tspan></text><text x="884.0" y="1008.0" fill="#202b24" font-size="23" font-weight="700" text-anchor="middle"><tspan x="884.0" dy="0">Method candidate</tspan></text><text x="884.0" y="1038.0" fill="#5f6a62" font-size="20" font-weight="450" text-anchor="middle"><tspan x="884.0" dy="0">Keep source and scope</tspan></text><text x="1230.0" y="1008.0" fill="#fff" font-size="23" font-weight="700" text-anchor="middle"><tspan x="1230.0" dy="0">Reuse when applicable</tspan></text><text x="1230.0" y="1038.0" fill="#fff" font-size="20" font-weight="450" text-anchor="middle"><tspan x="1230.0" dy="0">Apply to a later task</tspan></text><text x="720" y="1078" fill="#5f6a62" font-size="21" font-weight="450" text-anchor="middle"><tspan x="720" dy="0">Resume the same Work; Service supplies methods while the host retains business facts, access and decisions.</tspan></text></svg>
