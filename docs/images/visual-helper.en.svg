<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 610" role="img" aria-labelledby="title desc" style="background:#faf9f5;font-family:system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;fill:#24312b"><title id="title">One Work, from sources to delivery</title><desc id="desc">Sources and goals：Synthetic example: keep the goal, sources and valid decisions on one Work. Preserve large materials in files and read only the sections needed now.；Capability roles：Confirm system modules first, then refine each module. Independent modules can proceed in parallel; local problems return only the affected part for revision.；Verify and adopt：Check delivered files and receipts. Record output, verification and adoption separately; the animation explains the rules and does not prove execution.</desc><rect width="100%" height="100%" fill="#faf9f5"/><defs><marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#496054"/></marker><marker id="return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6b55b8"/></marker><marker id="decision" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b56328"/></marker></defs><text x="680" y="30" text-anchor="middle" font-size="27" font-weight="700">One Work, from sources to delivery</text><g data-stage-index="0" class="stage"><rect x="152" y="70" width="1056" height="134" rx="14" fill="#edf1ed" stroke="#a6afa9"/><text x="168" y="94" font-weight="650" font-size="18">1 · Sources and goals</text></g><g data-stage-index="1" class="stage"><rect x="152" y="230" width="1056" height="134" rx="14" fill="#f5f0e6" stroke="#a6afa9"/><text x="168" y="254" font-weight="650" font-size="18">2 · Capability roles</text></g><g data-stage-index="2" class="stage"><rect x="152" y="390" width="1056" height="134" rx="14" fill="#edf1ed" stroke="#a6afa9"/><text x="168" y="414" font-weight="650" font-size="18">3 · Verify and adopt</text></g><g data-stage-index="1" class="edge"><path d="M 680 174 V 226 H 548 V 270 H 430 V 273" fill="none" stroke="#496054" stroke-width="2" marker-end="url(#flow)"/><text x="555" y="220" font-size="13" fill="#496054" ></text></g><g data-stage-index="1" class="edge"><path d="M 540 306 H 815" fill="none" stroke="#496054" stroke-width="2" marker-end="url(#flow)"/><text x="680" y="297" font-size="13" fill="#496054" ></text></g><g data-stage-index="2" class="edge"><path d="M 930 334 V 386 H 680 V 433" fill="none" stroke="#496054" stroke-width="2" marker-end="url(#flow)"/><text x="805" y="380" font-size="13" fill="#496054" ></text></g><g data-stage-index="2" class="edge"><path d="M 680 494 V 508 H 130 V 270 H 930 V 273" fill="none" stroke="#6b55b8" stroke-width="2" marker-end="url(#return)"/><text x="122" y="386" font-size="13" fill="#6b55b8" text-anchor="middle" transform="rotate(-90 122 386)">Local edit</text></g><g data-stage-index="0" class="node"><title>goal: Work + inputs</title><rect x="570" y="118" width="220" height="56" rx="10" fill="#ffffff" stroke="#a6afa9"/><text x="680" y="152" text-anchor="middle" font-size="16">Work + inputs</text></g><g data-stage-index="1" class="node"><title>prd: Module PRD</title><rect x="320" y="278" width="220" height="56" rx="10" fill="#ffffff" stroke="#a6afa9"/><text x="430" y="312" text-anchor="middle" font-size="16">Module PRD</text></g><g data-stage-index="1" class="node"><title>detail: Module design</title><rect x="820" y="278" width="220" height="56" rx="10" fill="#ffffff" stroke="#a6afa9"/><text x="930" y="312" text-anchor="middle" font-size="16">Module design</text></g><g data-stage-index="2" class="node"><title>receipt: Receipt plus adoption</title><rect x="570" y="438" width="220" height="56" rx="10" fill="#ffffff" stroke="#a6afa9"/><text x="680" y="462" text-anchor="middle