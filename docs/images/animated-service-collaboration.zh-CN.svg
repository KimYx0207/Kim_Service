<title id="title">Meta 安排工作，Service 提供方法</title><desc id="desc">同一份 PRD 分两轮展开，再按依赖安排任务. 主要步骤与连接始终显示；动画解释顺序与状态变化，减少动态效果时显示完整结果。</desc>
