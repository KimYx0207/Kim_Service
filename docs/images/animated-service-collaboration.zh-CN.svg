<rect width="960" height="1543" rx="28" fill="#f5f8fc"/><text x="480" y="54" class="tiny center">KIM SERVICE  /  03</text><text x="480" y="111" class="title center">Meta 安排工作，Service 提供方法</text><text x="480" y="157" class="sub center">同一份 PRD 分两轮展开，再按依赖安排任务</text>
<rect x="64" y="208" width="832" height="120" rx="22" fill="#e8eef7" opacity=".7"/><rect x="64" y="205" width="832" height="120" rx="22" fill="#edf3ff" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p0" x="64" y="205" width="832" height="120" rx="22" stroke="#2968e8"/><text x="480" y="254" class="label center">目标与验收要求</text><text x="480" y="297" class="body center">把预约页做成可继续开发的产品</text><path class="route" d="M480 325 V367"/><path class="trail phase p0" d="M480 325 V367" stroke="#2968e8"/><circle class="moving-dot phase p0" r="6" fill="#2968e8"><animateMotion path="M480 325 V367" dur="2.7s" repeatCount="indefinite"/></circle><path d="M473 365 L480 374 L487 365" fill="none" stroke="#2968e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="383" width="832" height="120" rx="22" fill="#e8eef7" opacity=".7"/><rect x="64" y="380" width="832" height="120" rx="22" fill="#fff" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p0" x="64" y="380" width="832" height="120" rx="22" stroke="#7c56d8"/><text x="480" y="428" class="label center">第一轮 PRD：系统与模块大纲</text><text x="480" y="473" class="body center">定范围、模块边界和共同约定</text><path class="route" d="M480 500 V542"/><path class="trail phase p1" d="M480 500 V542" stroke="#7c56d8"/><circle class="moving-dot phase p1" r="6" fill="#7c56d8"><animateMotion path="M480 500 V542" dur="2.7s" repeatCount="indefinite"/></circle><path d="M473 540 L480 549 L487 540" fill="none" stroke="#7c56d8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="558" width="832" height="120" rx="22" fill="#e8eef7" opacity=".7"/><rect x="64" y="555" width="832" height="120" rx="22" fill="#fff" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p1" x="64" y="555" width="832" height="120" rx="22" stroke="#7c56d8"/><text x="480" y="603" class="label center">第二轮 PRD：逐模块详细设计</text><text x="480" y="648" class="body center">明确页面状态、接口字段和验收方法</text><path class="route" d="M480 675 V716 H262 V753"/><path class="trail phase p2" d="M480 675 V716 H262 V753" stroke="#2968e8"/><circle class="moving-dot phase p2" r="6" fill="#2968e8"><animateMotion path="M480 675 V716 H262 V753" dur="2.7s" repeatCount="indefinite"/></circle><path class="route" d="M480 675 V716 H698 V753"/><path class="trail phase p2" d="M480 675 V716 H698 V753" stroke="#0d9488"/><circle class="moving-dot phase p2" r="6" fill="#0d9488"><animateMotion path="M480 675 V716 H698 V753" dur="2.7s" repeatCount="indefinite"/></circle><path d="M255 750 L262 759 L269 750" fill="none" stroke="#2968e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M691 750 L698 759 L705 750" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="768" width="396" height="177" rx="22" fill="#e8eef7" opacity=".7"/><rect x="64" y="765" width="396" height="177" rx="22" fill="#fff" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p2" x="64" y="765" width="396" height="177" rx="22" stroke="#2968e8"/><text x="88" y="814" class="label">页面与交互</text><text x="88" y="862" class="body">使用设计、前端等方法</text><text x="88" y="901" class="body">实现已确定的页面状态</text><rect x="500" y="768" width="396" height="177" rx="22" fill="#e8eef7" opacity=".7"/><rect x="500" y="765" width="396" height="177" rx="22" fill="#fff" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p2" x="500" y="765" width="396" height="177" rx="22" stroke="#0d9488"/><text x="524" y="814" class="label">接口与数据</text><text x="524" y="862" class="body">使用后端、数据等方法</text><text x="524" y="901" class="body">实现已确定的数据约定</text><path class="route" d="M262 942 V989"/><path class="trail phase p3" d="M262 942 V989" stroke="#2968e8"/><circle class="moving-dot phase p3" r="6" fill="#2968e8"><animateMotion path="M262 942 V989" dur="2.7s" repeatCount="indefinite"/></circle><path class="route" d="M698 942 V989"/><path class="trail phase p3" d="M698 942 V989" stroke="#ce7b24"/><circle class="moving-dot phase p3" r="6" fill="#ce7b24"><animateMotion path="M698 942 V989" dur="2.7s" repeatCount="indefinite"/></circle><path d="M255 986 L262 995 L269 986" fill="none" stroke="#2968e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M691 986 L698 995 L705 986" fill="none" stroke="#ce7b24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="1004" width="396" height="125" rx="22" fill="#e8eef7" opacity=".7"/><rect x="64" y="1001" width="396" height="125" rx="22" fill="#edf3ff" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p3" x="64" y="1001" width="396" height="125" rx="22" stroke="#2968e8"/><text x="88" y="1047" class="label">独立部分继续</text><text x="88" y="1093" class="note">样式、错误提示照常完成</text><rect x="500" y="1004" width="396" height="125" rx="22" fill="#e8eef7" opacity=".7"/><rect x="500" y="1001" width="396" height="125" rx="22" fill="#fff7ed" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p3" x="500" y="1001" width="396" height="125" rx="22" stroke="#ce7b24"/><g class="before swap"><text x="524" y="1047" class="label">新增字段待确认</text><text x="524" y="1093" class="note">受影响的接口暂时等待</text></g><g class="after swap"><rect x="500" y="1001" width="396" height="125" rx="22" fill="#edf8f6" stroke="#0d9488" stroke-width="2"/><text x="524" y="1047" class="label">字段确认，接续</text><text x="524" y="1093" class="note">保留已完成的部分</text></g><path class="route" d="M262 1126 V1170 H480 V1214"/><path class="trail phase p4" d="M262 1126 V1170 H480 V1214" stroke="#2968e8"/><circle class="moving-dot phase p4" r="6" fill="#2968e8"><animateMotion path="M262 1126 V1170 H480 V1214" dur="2.7s" repeatCount="indefinite"/></circle><path class="route" d="M698 1126 V1170 H480"/><path class="trail phase p4" d="M698 1126 V1170 H480" stroke="#0d9488"/><circle class="moving-dot phase p4" r="6" fill="#0d9488"><animateMotion path="M698 1126 V1170 H480" dur="2.7s" repeatCount="indefinite"/></circle><path d="M473 1211 L480 1220 L487 1211" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="1230" width="832" height="132" rx="22" fill="#e8eef7" opacity=".7"/><rect x="64" y="1227" width="832" height="132" rx="22" fill="#edf8f6" stroke="#dbe4f0" stroke-width="2"/><rect class="focus phase p5" x="64" y="1227" width="832" height="132" rx="22" stroke="#0d9488"/><text x="480" y="1278" class="label center">条件补齐后汇合，检查完整体验</text><text x="480" y="1325" class="body center">把页面与接口接起来，按真实用户路径验收</text><rect x="48" y="1399" width="864" height="69" rx="18" fill="#eaf0fb"/><text x="480" y="1443" class="note center steady">确定依赖 → 并行推进 → 局部等待 → 汇合验收</text><text x="480" y="1443" class="note center phase-copy phase p0">先定系统范围、模块和共同约定</text><text x="480" y="1443" class="note center phase-copy phase p1">逐模块写清要做什么、怎样验收</text><text x="480" y="1443" class="note center phase-copy phase p2">前提具备，独立分支开始并行</text><text x="480" y="1443" class="note center phase-copy phase p3">中途补充字段，只等待受影响分支</text><text x="480" y="1443" class="note center phase-copy phase p4">字段明确后接续，其他成果保留</text><text x="480" y="1443" class="note center phase-copy phase p5">汇合验证完整体验，保存下一步</text><text x="480" y="1509" class="tiny center">实际执行与并发能力，由当前 AI 客户端提供</text>
